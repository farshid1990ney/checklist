const { useState, useEffect, useRef, useMemo, useCallback, createContext, useContext, Fragment } = React;

/* ============================================================
   ۰. توابع کمکی: هش SHA-256، اعداد فارسی، تاریخ شمسی
   ============================================================ */

async function sha256Hex(text) {
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function validatePasswordStrength(pw) {
  if (!pw || pw.length < 6) return 'رمز عبور باید حداقل ۶ کاراکتر باشد.';
  if (!/[0-9]/.test(toEnglishDigits(pw))) return 'رمز عبور باید حداقل یک رقم عددی داشته باشد.';
  return null;
}

const FA_DIGITS = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
const AR_DIGITS = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
function toEnglishDigits(str) {
  if (str === null || str === undefined) return str;
  str = String(str);
  return str.replace(/[۰-۹]/g, d => FA_DIGITS.indexOf(d))
             .replace(/[٠-٩]/g, d => AR_DIGITS.indexOf(d));
}
function toPersianDigits(str) {
  if (str === null || str === undefined) return str;
  return String(str).replace(/[0-9]/g, d => FA_DIGITS[+d]);
}

/* --- تبدیل تقویم میلادی <-> شمسی (الگوریتم استاندارد جلالی) --- */
function div(a, b) { return Math.trunc(a / b); }
function jalCal(jy) {
  const breaks = [-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
  let bl = breaks.length, gy = jy + 621, leapJ = -14, jp = breaks[0], jm, jump = 0, leap, n, i;
  if (jy < jp || jy >= breaks[bl - 1]) throw new Error('سال نامعتبر');
  for (i = 1; i < bl; i += 1) {
    jm = breaks[i];
    jump = jm - jp;
    if (jy < jm) break;
    leapJ += div(jump, 33) * 8 + div(jump % 33, 4);
    jp = jm;
  }
  n = jy - jp;
  leapJ += div(n, 33) * 8 + div((n % 33) + 3, 4);
  if ((jump % 33) === 4 && (jump - n) === 4) leapJ += 1;
  const leapG = div(gy, 4) - div((div(gy, 100) + 1) * 3, 4) - 150;
  const march = 20 + leapJ - leapG;
  if ((jump - n) < 6) n = n - jump + div(jump + 4, 33) * 33;
  leap = ((((n + 1) % 33) - 1) % 4);
  if (leap === -1) leap = 4;
  return { leap, gy, march };
}
function g2d(gy, gm, gd) {
  let d = div((gy + div(gm - 8, 6) + 100100) * 1461, 4)
    + div(153 * ((gm + 9) % 12) + 2, 5) + gd - 34840408;
  d = d - div(div(gy + 100100 + div(gm - 8, 6), 100) * 3, 4) + 752;
  return d;
}
function d2g(jdn) {
  let j = 4 * jdn + 139361631;
  j = j + div(div(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;
  const i = div((j % 1461), 4) * 5 + 308;
  const gd = div(i % 153, 5) + 1;
  const gm = (div(i, 153) % 12) + 1;
  const gy = div(j, 1461) - 100100 + div(8 - gm, 6);
  return [gy, gm, gd];
}
function mod(a, b) { return a - b * Math.floor(a / b); }
function toGregorian(jy, jm, jd) {
  const r = jalCal(jy);
  const jdn = g2d(r.gy, 3, r.march) + (jm - 1) * 31 - div(jm, 7) * (jm - 7) + jd - 1;
  return d2g(jdn);
}
function toJalali(gy, gm, gd) {
  const jdn = g2d(gy, gm, gd);
  const gy0 = d2g(jdn)[0];
  let jy = gy0 - 621;
  const r = jalCal(jy);
  const jdn1f = g2d(r.gy, 3, r.march);
  let k = jdn - jdn1f, jm, jd;
  if (k >= 0) {
    if (k <= 185) return [jy, 1 + div(k, 31), mod(k, 31) + 1];
    k -= 186;
  } else {
    jy -= 1;
    k += 179;
    if (r.leap === 1) k += 1;
  }
  jm = 7 + div(k, 30);
  jd = mod(k, 30) + 1;
  return [jy, jm, jd];
}
function pad2(n) { return String(n).padStart(2, '0'); }
function gregorianToJalaliStr(dateObj) {
  const [jy, jm, jd] = toJalali(dateObj.getFullYear(), dateObj.getMonth() + 1, dateObj.getDate());
  return `${jy}/${pad2(jm)}/${pad2(jd)}`;
}
function nowJalaliDateTime() {
  const d = new Date();
  return `${gregorianToJalaliStr(d)} - ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function jalaliMonthName(m) {
  const names = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
  return names[m - 1];
}
function jalaliMonthLength(jy, jm) {
  if (jm <= 6) return 31;
  if (jm <= 11) return 30;
  return jalCal(jy).leap === 1 ? 30 : 29;
}

/* ============================================================
   ۱. تولید بارکد QR وکتور SVG خالص
   ============================================================ */
function buildQrSvgMarkup(text, opts) {
  opts = opts || {};
  const fg = opts.fg || '#0f172a';
  const bg = opts.bg || '#ffffff';
  const margin = opts.margin === undefined ? 2 : opts.margin;
  let qr;
  try {
    qr = qrcode(0, 'H');
    qr.addData(text);
    qr.make();
  } catch (e) {
    qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
  }
  const count = qr.getModuleCount();
  const size = count + margin * 2;
  let path = '';
  for (let r = 0; r < count; r++) {
    for (let c = 0; c < count; c++) {
      if (qr.isDark(r, c)) {
        path += `M${c + margin},${r + margin}h1v1h-1z `;
      }
    }
  }
  return `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" width="100%" height="100%">` +
    `<rect x="0" y="0" width="${size}" height="${size}" fill="${bg}"/>` +
    `<path d="${path}" fill="${fg}"/>` +
    `</svg>`;
}

function svgMarkupToPngDataUrl(svgMarkup, pixelSize) {
  return new Promise((resolve, reject) => {
    try {
      const px = pixelSize || 800;
      const svgBlob = new Blob([svgMarkup], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = px; canvas.height = px;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, px, px);
        ctx.drawImage(img, 0, 0, px, px);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL('image/png'));
      };
      img.onerror = reject;
      img.src = url;
    } catch (e) { reject(e); }
  });
}

function downloadDataUrl(dataUrl, filename) {
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function makeScanUrl(assetId) {
  const base = window.location.href.split('?')[0].split('#')[0];
  return `${base}?scan=${encodeURIComponent(assetId)}`;
}

/* ============================================================
   ۲. لایه ذخیره‌سازی (Store) — localStorage + هش‌سازی + مهاجرت
   ============================================================ */
const STORAGE_KEY = 'derkav_checklist_app_v3';
const SESSION_KEY = 'derkav_checklist_session_v3';
const APP_VERSION = 3;

// =====================================================================
// پیکربندی پیش‌فرض اتصال ابری (اختیاری، اما شدیداً توصیه می‌شود)
// =====================================================================
// اگر پیش از انتشار این فایل (مثلاً روی GitHub Pages) این دو مقدار را همین‌جا
// پر کنید، همه‌ی کاربران و دستگاه‌ها (کامپیوتر، گوشی، هر مرورگری) به‌طور
// خودکار به همان یک پایگاه ابری مشترک روی Google Drive وصل می‌شوند — بدون
// این‌که لازم باشد کسی آدرس یا کلید را دستی در تنظیمات وارد کند. حساب‌ها،
// تجهیزات، قالب‌ها و سوابقی که روی یک دستگاه ساخته می‌شوند، همان لحظه (یا با
// اولین ورود) روی بقیه‌ی دستگاه‌ها هم در دسترس خواهند بود.
// اگر این دو مقدار را خالی بگذارید، برنامه مثل قبل کاملاً محلی (فقط همان
// مرورگر) کار می‌کند و هرکسی باید URL/کلید را خودش در «تنظیمات» وارد کند.
const DEFAULT_APPS_SCRIPT_URL = ''; // نمونه: 'https://script.google.com/macros/s/AKfycb.../exec'
const DEFAULT_CLOUD_API_KEY = '';   // همان مقداری که در Script Properties با نام API_KEY ثبت کردید

// آدرس/کلید مؤثر برای هر عملیات ابری: اگر کاربر در تنظیمات مقداری وارد کرده
// باشد همان اولویت دارد؛ در غیر این صورت از مقدار پیش‌فرض بالا استفاده می‌شود.
function resolveCloudConfig(settings) {
  const s = settings || {};
  return {
    url: String((s.googleAppsScriptUrl || DEFAULT_APPS_SCRIPT_URL) || '').trim(),
    apiKey: String((s.cloudApiKey || DEFAULT_CLOUD_API_KEY) || '').trim(),
  };
}

const DEFAULT_CATEGORIES = ['برق', 'مکانیک', 'ایمنی و آتش‌نشانی', 'عمومی'];

      { id: 'it-2', type: 'yesno', label: 'اتصال زمین (ارت) برقرار است؟', weight: 15, critical: true },
      { id: 'it-3', type: 'yesno', label: 'نشانه‌های سوختگی یا بوی غیرعادی وجود ندارد؟', weight: 15, critical: true },
      { id: 'it-4', type: 'rating', label: 'وضعیت کلی نظافت و مرتب بودن سیم‌کشی', weight: 10, critical: false, scaleMax: 5 },
      { id: 'it-5', type: 'numeric', label: 'دمای سطح تابلو (درجه سانتی‌گراد)', weight: 0, critical: false },
      { id: 'it-6', type: 'select', label: 'وضعیت کلی تابلو', weight: 10, critical: false, options: ['سالم', 'نیاز به بررسی', 'معیوب'] },
      { id: 'it-7', type: 'text', label: 'ملاحظات و توضیحات تکمیلی', weight: 0, critical: false },

function makeDefaultAssets() {
  const arr = [];
  for (let i = 1; i <= 20; i++) {
    const code = `DB-${pad2(i)}`;
    arr.push({
      id: `asset-${code}`,

async function makeDefaultData() {
  const adminHash = await sha256Hex('1234');
  const pinHash = await sha256Hex('123456');
  return {
    version: APP_VERSION,
    users: [
      { id: 'u-admin', username: 'admin', passwordHash: adminHash, role: 'admin', name: 'مدیر سیستم', active: true },

    assets: makeDefaultAssets(),

    records: [],
    settings: {
      orgName: 'سازمان درکاو',
      logoDataUrl: '',
      managerPinHash: pinHash,

}

function loadRawData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) {
    console.error('خطا در خواندن داده‌های ذخیره‌شده، داده خام نامعتبر است.', e);
    return null;
  }
}

let saveTimer = null;
function persistData(data) {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {
      console.error('خطا در ذخیره‌سازی داده‌ها در localStorage', e);
    }
  }, 150); // جلوگیری از رقابت (race condition) نوشتن‌های پیاپی روی localStorage
}

function migrateData(data) {
  if (!data.version || data.version < 3) {
    data.version = APP_VERSION;
    data.assignments = data.assignments || [];
    data.settings = data.settings || {};
    if (data.settings.passThreshold === undefined) data.settings.passThreshold = 80;
    if (data.settings.googleAppsScriptUrl === undefined) data.settings.googleAppsScriptUrl = '';
    if (data.settings.googleClientId === undefined) data.settings.googleClientId = '';
    if (data.settings.cloudApiKey === undefined) data.settings.cloudApiKey = '';
  }
  // این بخش صرف‌نظر از نسخه همیشه اجرا می‌شود تا داده‌های قدیمی‌تر هم با نقش
  // جدید «ادمین» سازگار شوند (پنل مدیریت کاربران/تنظیمات فقط برای این نقش است).
  data.assignments = data.assignments || [];
  if (Array.isArray(data.users) && data.users.length && !data.users.some(u => u.role === 'admin')) {
    const target = data.users.find(u => u.username === 'admin') || data.users.find(u => u.role === 'manager') || data.users[0];
    if (target) target.role = 'admin';
  }
  // اگر آدرس/کلید ابری در این دستگاه هنوز خالی است، مقدار پیش‌فرضی که در خود
  // فایل منتشرشده تنظیم شده (در صورت وجود) جایگزین می‌شود.
  if (data.settings) {
    if (!data.settings.googleAppsScriptUrl) data.settings.googleAppsScriptUrl = DEFAULT_APPS_SCRIPT_URL;
    if (!data.settings.cloudApiKey) data.settings.cloudApiKey = DEFAULT_CLOUD_API_KEY;
  }
  return data;
}

function validateBackupShape(data) {
  if (!data || typeof data !== 'object') return 'فایل پشتیبان نامعتبر است.';
  const required = ['users', 'assets', 'templates', 'records', 'settings'];
  for (const k of required) {
    if (!(k in data)) return `فیلد «${k}» در فایل پشتیبان یافت نشد.`;
  }
  if (!Array.isArray(data.users) || !Array.isArray(data.assets) || !Array.isArray(data.templates) || !Array.isArray(data.records)) {
    return 'ساختار آرایه‌ای فایل پشتیبان معتبر نیست.';
  }
  return null;
}

/* ============================================================
   ۳. موتور امتیازدهی چک‌لیست
   ============================================================ */
function scoreRecord(template, answers) {
  let earned = 0, totalWeight = 0, criticalFail = false;
  const details = [];
  (template.items || []).forEach(item => {
    const val = answers[item.id];
    let itemEarned = null, itemMax = item.weight || 0;
    if (item.type === 'checkbox') {
      totalWeight += itemMax;
      itemEarned = val ? itemMax : 0;
      if (item.critical && !val) criticalFail = true;
    } else if (item.type === 'yesno') {
      totalWeight += itemMax;
      itemEarned = val === 'بله' ? itemMax : 0;
      if (item.critical && val === 'خیر') criticalFail = true;
    } else if (item.type === 'rating') {
      const max = item.scaleMax || 5;
      totalWeight += itemMax;
      const num = Number(toEnglishDigits(val)) || 0;
      itemEarned = (num / max) * itemMax;
    } else if (item.type === 'select' && item.correctValue) {
      totalWeight += itemMax;
      itemEarned = val === item.correctValue ? itemMax : 0;
    } else {
      itemEarned = null; // اطلاعاتی (عددی/متنی/انتخابی بدون مقدار صحیح) — در امتیاز محاسبه نمی‌شود
    }
    if (itemEarned !== null) earned += itemEarned;
    details.push({ itemId: item.id, label: item.label, value: val, earned: itemEarned, max: itemMax, critical: !!item.critical });
  });
  const percent = totalWeight > 0 ? Math.round((earned / totalWeight) * 100) : 100;
  let status;
  if (criticalFail) status = 'ناموفق (حیاتی)';
  else if (percent >= (template.passThreshold || 80)) status = 'موفق';
  else status = 'ناموفق';
  return { percent, status, criticalFail, details, totalWeight, earned };
}

function qualityLabel(percent) {
  if (percent >= 95) return 'عالی';
  if (percent >= 80) return 'خوب';
  if (percent >= 60) return 'متوسط';
  if (percent >= 40) return 'ضعیف';
  return 'بحرانی';
}

const ROLE_LABELS = {

// که همیشه فقط مخصوص نقش «ادمین» می‌مانند و از این طریق قابل واگذاری نیستند).
const ASSIGNABLE_PAGES = [
  { key: 'dashboard', label: 'داشبورد' },
  { key: 'runner', label: 'اجرای بازرسی' },
  { key: 'assets', label: 'تجهیزات' },
  { key: 'records', label: 'سوابق' },
  { key: 'templates', label: 'قالب‌های چک‌لیست' },
  { key: 'tasks', label: 'وظایف' },
  { key: 'help', label: 'راهنما' },
];

const DEFAULT_PAGES_BY_ROLE = {
  admin: ['dashboard', 'runner', 'assets', 'records', 'templates', 'tasks', 'users', 'settings', 'help'],
  manager: ['dashboard', 'runner', 'assets', 'records', 'templates', 'tasks', 'help'],
  inspector: ['dashboard', 'runner', 'assets', 'records', 'tasks', 'help'],
  approver: ['dashboard', 'assets', 'records', 'tasks', 'help'],
  viewer: ['dashboard', 'assets', 'records', 'help'],
};

// دسترسی نهایی هر کاربر به صفحات: نقش «ادمین» همیشه دسترسی کامل دارد؛ برای
// بقیه‌ی نقش‌ها، در صورت تعریف فهرست اختصاصی (u.pages) همان معیار است، وگرنه
// پیش‌فرض همان نقش اعمال می‌شود. صفحات «کاربران» و «تنظیمات» در هر صورت فقط
// برای نقش «ادمین» فعال می‌شوند و از طریق این فهرست قابل واگذاری نیستند.
function effectivePages(user) {
  if (!user) return [];
  if (user.role === 'admin') return DEFAULT_PAGES_BY_ROLE.admin.slice();
  const base = (user.pages && user.pages.length) ? user.pages : (DEFAULT_PAGES_BY_ROLE[user.role] || []);
  return base.filter(p => p !== 'users' && p !== 'settings');
}

function DataProvider({ children }) {
  const [data, setData] = useState(null);
  const [ready, setReady] = useState(false);
  const [session, setSession] = useState(() => {
    try { return JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { return null; }
  });
  const [toast, setToast] = useState(null);
  const [cloudBootstrapping, setCloudBootstrapping] = useState(false);

  useEffect(() => {
    (async () => {
      let raw = loadRawData();
      if (!raw) {
        // دستگاه/مرورگر کاملاً تازه است: اگر پایگاه ابری پیکربندی شده باشد
        // (چه به‌صورت پیش‌فرض در خود فایل، چه قبلاً روی دستگاه دیگری تنظیم
        // شده و اکنون در دسترس است)، ابتدا آخرین نسخه‌ی مشترک را می‌گیریم تا
        // حساب‌ها و اطلاعاتی که روی سایر دستگاه‌ها ساخته شده همین‌جا هم فوراً
        // در دسترس باشد؛ در غیر این صورت داده‌ی پیش‌فرض محلی ساخته می‌شود.
        const { url, apiKey } = resolveCloudConfig({});
        if (url) {
          setCloudBootstrapping(true);
          try {
            const res = await callAppsScript(url, { cloudApiKey: apiKey }, { action: 'cloud_pull' });
            if (res && res.data && Array.isArray(res.data.users) && res.data.users.length) {
              raw = migrateData(res.data);
            }
          } catch (e) { /* بدون پایگاه ابری در دسترس؛ به داده‌ی پیش‌فرض محلی برمی‌گردیم */ }
          setCloudBootstrapping(false);
        }
        if (!raw) raw = await makeDefaultData();
      } else {
        raw = migrateData(raw);
      }
      setData(raw);
      setReady(true);
    })();
  }, []);

  useEffect(() => {
    if (ready && data) persistData(data);
  }, [data, ready]);

  // ارسال خودکار (در پس‌زمینه) هر تغییری در داده‌ها به پایگاه ابری، در صورت
  // پیکربندی بودن اتصال؛ این‌گونه لازم نیست کسی دستی دکمه‌ی «ارسال» را بزند.
  useEffect(() => {
    if (!ready || !data) return;
    const { url, apiKey } = resolveCloudConfig(data.settings);
    if (!url) return;
    const t = setTimeout(() => {
      callAppsScript(url, { cloudApiKey: apiKey }, {
        action: 'cloud_push',
        meta: { device: navigator.userAgent, at: new Date().toISOString() },
        data,
      }).catch(() => { /* ارسال پس‌زمینه؛ شکست آن کاربر را متوقف نمی‌کند */ });
    }, 2000); // تأخیر کوتاه تا تغییرات پیاپی یک‌جا ارسال شوند
    return () => clearTimeout(t);
  }, [data, ready]);

  const notify = useCallback((message, kind) => {
    setToast({ message, kind: kind || 'info', id: Date.now() });
  }, []);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 3200);
    return () => clearTimeout(t);
  }, [toast]);

  const update = useCallback((fn) => {
    setData(prev => {
      const draft = JSON.parse(JSON.stringify(prev));
      fn(draft);
      return draft;
    });
  }, []);

  const login = useCallback(async (username, password) => {
    const hash = await sha256Hex(password);
    let user = (data.users || []).find(u => u.username === username && u.active !== false);
    if (!user || user.passwordHash !== hash) {
      // ممکن است این حساب روی دستگاه دیگری ساخته شده و هنوز به این دستگاه
      // نرسیده باشد؛ پیش از رد کردن ورود، یک تلاش خودکار برای دریافت آخرین
      // نسخه از پایگاه ابری انجام می‌شود.
      const { url, apiKey } = resolveCloudConfig(data.settings);
      if (url) {
        try {
          const res = await callAppsScript(url, { cloudApiKey: apiKey }, { action: 'cloud_pull' });
          if (res && res.data && Array.isArray(res.data.users) && res.data.users.length) {
            const fresh = migrateData(res.data);
            setData(fresh);
            user = fresh.users.find(u => u.username === username && u.active !== false);
          }
        } catch (e) { /* بی‌صدا نادیده گرفته می‌شود؛ در نهایت خطای ورود عادی نمایش داده می‌شود */ }
      }
    }
    if (!user || user.passwordHash !== hash) return 'نام کاربری یا رمز عبور اشتباه است.';
    const sess = { userId: user.id, username: user.username, role: user.role, name: user.name };
    setSession(sess);
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(sess));
    return null;
  }, [data]);

  const logout = useCallback(() => {
    setSession(null);
    sessionStorage.removeItem(SESSION_KEY);
  }, []);

  const verifyManagerPin = useCallback(async (pin) => {
    const hash = await sha256Hex(pin);
    return data && data.settings.managerPinHash === hash;
  }, [data]);

  const currentUser = useMemo(() => {
    if (!data || !session) return null;
    return (data.users || []).find(u => u.id === session.userId) || null;
  }, [data, session]);

  if (!ready || !data) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-slate-100">
        <div className="text-center">
          <div className="w-10 h-10 mx-auto border-4 border-brand-500 border-t-transparent rounded-full animate-spin"></div>
          <p className="mt-4 text-slate-500">{cloudBootstrapping ? 'در حال دریافت اطلاعات از پایگاه ابری…' : 'در حال آماده‌سازی سامانه…'}</p>
        </div>
      </div>
    );
  }

  return (
    <DataContext.Provider value={{ data, update, session, login, logout, currentUser, verifyManagerPin, notify }}>
      {children}
      {toast && (
        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[999] no-print toast-in">
          <div className={
            "px-4 py-2.5 rounded-xl shadow-lg text-sm font-medium border " +
            (toast.kind === 'error' ? "bg-danger-50 text-danger-700 border-danger-500/30" :
             toast.kind === 'success' ? "bg-ok-50 text-ok-700 border-ok-500/30" :
             "bg-white text-slate-700 border-slate-200")
          }>
            {toast.message}
          </div>
        </div>
      )}
    </DataContext.Provider>
  );
}

/* ============================================================
   ۵. صفحه ورود (Login Gate)
   ============================================================ */
function LoginScreen() {
  const { login, data } = useAppData();
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  const [showPw, setShowPw] = useState(false);

    e.preventDefault();
    if (!username || !password) { setError('نام کاربری و رمز عبور را وارد کنید.'); return; }
    setBusy(true);
    setError('');
    const err = await login(username.trim(), password);
    setBusy(false);
    if (err) setError(err);
  };

  return (
    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-brand-950 via-brand-900 to-brand-800 p-4">
      <div className="w-full max-w-sm">
        <div className="text-center mb-6">
          <div className="w-16 h-16 rounded-2xl bg-white/10 border border-white/20 mx-auto flex items-center justify-center mb-3">
            <svg viewBox="0 0 24 24" className="w-8 h-8 text-white" fill="none" stroke="currentColor" strokeWidth="1.6">
              <path d="M9 11l3 3L22 4" strokeLinecap="round" strokeLinejoin="round"/>
              <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </div>
          <h1 className="text-white text-xl font-bold">سامانه چک‌لیست درکاو</h1>
          <p className="text-brand-200 text-sm mt-1">بازرسی، ثبت و پیگیری تجهیزات</p>
        </div>
        <form onSubmit={submit} className="bg-white rounded-2xl shadow-2xl p-6 space-y-4">
          <div>
            <label className="block text-sm text-slate-600 mb-1.5">نام کاربری</label>
            <input value={username} onChange={e => setUsername(e.target.value)} autoFocus
              className="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500"
              placeholder="admin" />
          </div>
          <div>
            <label className="block text-sm text-slate-600 mb-1.5">رمز عبور</label>
            <div className="relative">
              <input type={showPw ? 'text' : 'password'} value={password} onChange={e => setPassword(e.target.value)}
                className="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 pl-10 outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500"
                placeholder="••••••" />

                {showPw ? 'پنهان' : 'نمایش'}

            </div>

            className="w-full bg-brand-600 hover:bg-brand-700 disabled:opacity-60 text-white rounded-xl py-2.5 font-medium transition">
            {busy ? 'در حال بررسی…' : 'ورود به سامانه'}
          </button>
          <p className="text-center text-xs text-slate-400 pt-1">حساب پیش‌فرض مدیر: admin / 1234 (پیشنهاد می‌شود پس از ورود تغییر یابد)</p>
        </form>
      </div>
    </div>

  if (status === 'ناموفق (حیاتی)') return <Badge tone="danger">ناموفق (حیاتی) ⚠</Badge>;

}

/* ============================================================
   ۷. انتخابگر تاریخ شمسی (Persian Date Picker)
   ============================================================ */
function PersianDatePicker({ value, onChange, placeholder }) {
  const [open, setOpen] = useState(false);
  const today = new Date();
  const [ty, tm] = toJalali(today.getFullYear(), today.getMonth() + 1, today.getDate());
  const parsed = useMemo(() => {
    if (!value) return null;
    const parts = toEnglishDigits(value).split('/').map(Number);
    if (parts.length === 3 && !parts.some(isNaN)) return parts;
    return null;
  }, [value]);
  const [viewY, setViewY] = useState(parsed ? parsed[0] : ty);
  const [viewM, setViewM] = useState(parsed ? parsed[1] : tm);
  const ref = useRef(null);

  useEffect(() => {
    function onDoc(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, []);

  const monthLen = jalaliMonthLength(viewY, viewM);
  const firstDow = useMemo(() => {
    const [gy, gm, gd] = toGregorian(viewY, viewM, 1);
    return new Date(gy, gm - 1, gd).getDay(); // 0=یکشنبه در ایران؟ در JS 0=Sunday
  }, [viewY, viewM]);
  // تبدیل به هفته شروع‌شونده از شنبه: JS Sunday=0..Saturday=6  =>  شنبه باید ستون اول باشد
  const leading = (firstDow + 1) % 7;

  const days = [];
  for (let i = 0; i < leading; i++) days.push(null);
  for (let d = 1; d <= monthLen; d++) days.push(d);

  const pick = (d) => {
    const str = `${viewY}/${pad2(viewM)}/${pad2(d)}`;
    onChange(str);
    setOpen(false);
  };

  const shiftMonth = (delta) => {
    let m = viewM + delta, y = viewY;
    if (m < 1) { m = 12; y -= 1; }
    if (m > 12) { m = 1; y += 1; }
    setViewM(m); setViewY(y);
  };

  return (
    <div className="relative" ref={ref}>
      <div className="relative">
        <input
          readOnly value={value ? toPersianDigits(value) : ''} onClick={() => setOpen(o => !o)}
          placeholder={placeholder || 'انتخاب تاریخ'} dir="ltr"
          className={inputCls + " cursor-pointer text-right"} />
        <svg onClick={() => setOpen(o => !o)} className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer" fill="none" stroke="currentColor" strokeWidth="1.8" viewBox="0 0 24 24">
          <rect x="3" y="5" width="18" height="16" rx="2" /><path d="M8 3v4M16 3v4M3 10h18" strokeLinecap="round" />
        </svg>
      </div>
      {open && (
        <div className="absolute z-40 mt-2 bg-white border border-slate-200 rounded-2xl shadow-xl p-3 w-72">
          <div className="flex items-center justify-between mb-2">
            <button type="button" onClick={() => shiftMonth(1)} className="w-8 h-8 rounded-lg hover:bg-slate-100">›</button>
            <div className="font-medium text-sm">{jalaliMonthName(viewM)} {toPersianDigits(viewY)}</div>
            <button type="button" onClick={() => shiftMonth(-1)} className="w-8 h-8 rounded-lg hover:bg-slate-100">‹</button>
          </div>
          <div className="grid grid-cols-7 text-center text-xs text-slate-400 mb-1">
            {['ش','ی','د','س','چ','پ','ج'].map(d => <div key={d}>{d}</div>)}
          </div>
          <div className="grid grid-cols-7 gap-1">
            {days.map((d, i) => (
              <button type="button" key={i} disabled={!d} onClick={() => d && pick(d)}
                className={"h-8 rounded-lg text-sm " + (!d ? "" : "hover:bg-brand-50 " + (parsed && parsed[0]===viewY && parsed[1]===viewM && parsed[2]===d ? "bg-brand-600 text-white hover:bg-brand-600" : ""))}>
                {d ? toPersianDigits(d) : ''}
              </button>
            ))}
          </div>
          <button type="button" onClick={() => {
              const [jy, jm, jd] = toJalali(today.getFullYear(), today.getMonth() + 1, today.getDate());
              setViewY(jy); setViewM(jm);
              const str = `${jy}/${pad2(jm)}/${pad2(jd)}`;
              onChange(str);
              setOpen(false);
            }}
            className="mt-2 w-full text-xs text-brand-600 hover:underline">انتخاب امروز</button>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   ۸. استودیوی تمام‌صفحه امضای دیجیتال
   ============================================================ */
function SignaturePad({ open, onClose, onSave, roleLabel, initialName, initialTitle }) {
  const canvasRef = useRef(null);
  const drawing = useRef(false);
  const last = useRef({ x: 0, y: 0 });
  const [color, setColor] = useState('#0f172a');
  const [thickness, setThickness] = useState(3);
  const [hasDrawn, setHasDrawn] = useState(false);
  const [name, setName] = useState(initialName || '');
  const [title, setTitle] = useState(initialTitle || '');
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    if (!open) return;
    setName(initialName || '');
    setTitle(initialTitle || '');
    setHasDrawn(false);
    setSaving(false);
    const resize = () => {
      const canvas = canvasRef.current;
      if (!canvas) return;
      const parent = canvas.parentElement;
      const ratio = window.devicePixelRatio || 1;
      const prev = canvas.toDataURL ? (hasDrawn ? canvas.toDataURL() : null) : null;
      canvas.width = parent.clientWidth * ratio;
      canvas.height = parent.clientHeight * ratio;
      canvas.style.width = parent.clientWidth + 'px';
      canvas.style.height = parent.clientHeight + 'px';
      const ctx = canvas.getContext('2d');
      ctx.scale(ratio, ratio);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, parent.clientWidth, parent.clientHeight);
    };
    resize();
    window.addEventListener('resize', resize);
    return () => window.removeEventListener('resize', resize);
    // eslint-disable-next-line
  }, [open]);

  const getPos = (e) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const point = e.touches ? e.touches[0] : e;
    return {
      x: (point.clientX - rect.left) * (rect.width ? 1 : 1),
      y: (point.clientY - rect.top) * (rect.height ? 1 : 1),
    };
  };

  const start = (e) => {
    e.preventDefault();
    drawing.current = true;
    last.current = getPos(e);
    setHasDrawn(true);
  };
  const move = (e) => {
    if (!drawing.current) return;
    e.preventDefault();
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const pos = getPos(e);
    ctx.strokeStyle = color;
    ctx.lineWidth = thickness;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(last.current.x, last.current.y);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    last.current = pos;
  };
  const end = () => { drawing.current = false; };

  const clear = () => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const ratio = window.devicePixelRatio || 1;
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
    setHasDrawn(false);
  };

  const save = () => {
    if (!hasDrawn) { return; }
    if (!name.trim()) { return; }
    setSaving(true);
    const dataUrl = canvasRef.current.toDataURL('image/png');
    onSave({ image: dataUrl, name: name.trim(), title: title.trim(), signedAt: nowJalaliDateTime() });
    setSaving(false);
    onClose();
  };

  if (!open) return null;

  return (
    <div className="fixed inset-0 z-[70] no-print bg-white flex flex-col" style={{ height: '100dvh' }}>
      <div className="flex items-center justify-between px-4 py-3 border-b border-slate-100 shrink-0">
        <div>

/* ============================================================
   ۹. اسکنر دوربین زنده (بدون ری‌استارت مکرر — رفع باگ نمونه قبلی)
   ============================================================ */
function CameraScanner({ open, onClose, onDetect }) {
  const containerId = 'qr-camera-region';
  const instanceRef = useRef(null);
  const [error, setError] = useState('');
  const [scanning, setScanning] = useState(false);

  useEffect(() => {
    if (!open) return;
    let cancelled = false;
    setError('');
    const html5Qr = new Html5Qrcode(containerId);
    instanceRef.current = html5Qr;

    html5Qr.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 240, height: 240 } },
      (decodedText) => {
        if (cancelled) return;
        // جلوگیری از فراخوانی مکرر/ری‌استارت دوربین با متوقف کردن قطعی پس از اولین تشخیص
        cancelled = true;
        html5Qr.stop().then(() => html5Qr.clear()).catch(() => {}).finally(() => {
          onDetect(decodedText);
        });
      },
      () => { /* خطاهای فریم‌به‌فریم عادی نادیده گرفته می‌شود */ }
    ).then(() => { if (!cancelled) setScanning(true); })
      .catch(err => setError('دسترسی به دوربین ممکن نشد: ' + (err && err.message ? err.message : String(err))));

    return () => {
      cancelled = true;
      const inst = instanceRef.current;
      if (inst) {
        inst.stop().then(() => inst.clear()).catch(() => {});
      }
      instanceRef.current = null;
      setScanning(false);
    };
  }, [open]);

  if (!open) return null;
  return (
    <div className="fixed inset-0 z-[70] no-print bg-black flex flex-col" style={{ height: '100dvh' }}>
      <div className="flex items-center justify-between px-4 py-3 text-white shrink-0">
        <h3 className="font-bold">اسکن بارکد تجهیز</h3>
        <button onClick={onClose} className="w-9 h-9 rounded-lg hover:bg-white/10">✕</button>
      </div>
      <div className="flex-1 relative flex items-center justify-center">
        <div id={containerId} className="w-full max-w-md"></div>
        {!scanning && !error && (
          <div className="absolute inset-0 flex items-center justify-center text-white/70 text-sm">در حال راه‌اندازی دوربین…</div>
        )}
        {error && (
          <div className="absolute inset-x-4 top-1/2 -translate-y-1/2 text-center text-danger-300 text-sm bg-black/60 rounded-xl p-4">{error}</div>
        )}
      </div>
      <p className="text-white/50 text-xs text-center pb-6 shrink-0">بارکد روی برچسب تجهیز را داخل کادر قرار دهید</p>
    </div>
  );
}

    w.document.write(`
      <!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
      <title>برچسب ${asset.code}</title>
      <style>
        @page { size: 80mm 110mm; margin: 4mm; }

      </div>
      <script>window.onload=()=>{window.print();}<\/script>
      </body></html>`);
    w.document.close();
  };

  const downloadPng = async () => {
    try {
      const dataUrl = await svgMarkupToPngDataUrl(svgMarkup, 900);
      downloadDataUrl(dataUrl, `${asset.code}-qr.png`);
    } catch (e) { notify('خطا در تولید تصویر PNG', 'error'); }
  };

  const copyLink = async () => {
    try {
      await navigator.clipboard.writeText(scanUrl);
      notify('لینک اسکن کپی شد.', 'success');
    } catch (e) { notify('کپی خودکار پشتیبانی نمی‌شود؛ لینک: ' + scanUrl, 'info'); }
  };

  return (
    <div className="fixed inset-0 z-[70] no-print bg-slate-950/95 flex items-center justify-center p-4" style={{ height: '100dvh' }}>
      <button onClick={onClose} className="absolute top-4 left-4 text-white/70 hover:text-white w-10 h-10 rounded-xl hover:bg-white/10">✕</button>

        <h2 className="text-2xl font-black text-slate-800 tracking-wide">{asset.code}</h2>
        <p className="text-slate-500 text-sm mb-4">{asset.name}</p>
        <div ref={svgRef} className="w-48 h-48 mx-auto p-3 border border-slate-200 rounded-2xl" dangerouslySetInnerHTML={{ __html: svgMarkup }} />
        <div className="text-xs text-slate-400 mt-3 space-y-0.5">
          <p>محل استقرار: {asset.location || '—'}</p>
          <p>سریال: {asset.serial || '—'}</p>
        </div>
        <div className="grid grid-cols-2 gap-2 mt-5">
          <button onClick={onRun} className="col-span-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl py-2.5 text-sm font-medium">اجرای فرم بازرسی این تجهیز</button>
          <button onClick={printLabel} className="border border-slate-200 hover:bg-slate-50 rounded-xl py-2.5 text-sm text-slate-700">🖨️ چاپ برچسب</button>
          <button onClick={downloadPng} className="border border-slate-200 hover:bg-slate-50 rounded-xl py-2.5 text-sm text-slate-700">⬇️ دانلود PNG</button>
          <button onClick={copyLink} className="col-span-2 border border-slate-200 hover:bg-slate-50 rounded-xl py-2.5 text-sm text-slate-700">🔗 کپی لینک مستقیم اسکن</button>

function AssetsPage({ goRunner }) {
  const { data, update, currentUser, notify } = useAppData();
  const [studioAsset, setStudioAsset] = useState(null);
  const [scannerOpen, setScannerOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [confirmDel, setConfirmDel] = useState(null);
  const [query, setQuery] = useState('');
  const canManage = currentUser.role === 'admin' || currentUser.role === 'manager';

  const filtered = data.assets.filter(a =>
    (a.code + a.name + a.location).toLowerCase().includes(query.toLowerCase())
  );

  const saveAsset = (f) => {
    update(d => {
      if (editing && editing.id) {
        const idx = d.assets.findIndex(a => a.id === editing.id);
        d.assets[idx] = { ...d.assets[idx], ...f };
      } else {
        d.assets.push({ id: 'asset-' + Date.now(), ...f });
      }
    });
    setShowForm(false); setEditing(null);
    notify('تجهیز ذخیره شد.', 'success');
  };

  const deleteAsset = (id) => {
    update(d => { d.assets = d.assets.filter(a => a.id !== id); });
    setConfirmDel(null);
    notify('تجهیز حذف شد.', 'success');
  };

  const onScanDetected = (text) => {
    setScannerOpen(false);
    let assetId = text;
    try {
      const url = new URL(text);
      const p = url.searchParams.get('scan');
      if (p) assetId = p;
    } catch (e) { /* متن ساده بود، همان مقدار استفاده می‌شود */ }
    const asset = data.assets.find(a => a.id === assetId || a.code === assetId);
    if (asset) goRunner(asset.id);
    else notify('تجهیزی مطابق بارکد اسکن‌شده یافت نشد.', 'error');
  };

  return (
    <div className="space-y-5">
      <div className="flex flex-wrap items-center gap-3 justify-between">
        <div>
          <h2 className="text-lg font-bold text-slate-800">مدیریت تجهیزات</h2>
          <p className="text-sm text-slate-500">{toPersianDigits(data.assets.length)} تجهیز ثبت‌شده</p>
        </div>
        <div className="flex gap-2">
          <button onClick={() => setScannerOpen(true)} className="px-4 py-2.5 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-sm font-medium text-slate-700 flex items-center gap-1.5">
            📷 اسکن با دوربین
          </button>
          {canManage && (
            <button onClick={() => printAllLabelsSheet(data.assets, data.settings)} className="px-4 py-2.5 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-sm font-medium text-slate-700">
              🖨️ چاپ شیت کامل برچسب‌ها (A4)
            </button>
          )}
          {canManage && (
            <button onClick={() => { setEditing(null); setShowForm(true); }} className="px-4 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium">
              + تجهیز جدید
            </button>
          )}
        </div>
      </div>

      <input value={query} onChange={e => setQuery(e.target.value)} placeholder="جستجو بر اساس کد، نام یا محل…"
        className={inputCls + " max-w-sm"} />

      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        {filtered.map(a => (
          <div key={a.id} className="bg-white rounded-2xl border border-slate-200 p-4 hover:shadow-md transition">
            <div className="flex items-start justify-between">
              <div>
                <div className="font-bold text-slate-800">{a.code}</div>
                <div className="text-sm text-slate-500">{a.name}</div>
              </div>
              <button onClick={() => setStudioAsset(a)}
                className="w-16 h-16 border border-slate-200 rounded-xl p-1.5 hover:border-brand-400 transition"
                dangerouslySetInnerHTML={{ __html: buildQrSvgMarkup(makeScanUrl(a.id)) }} title="نمایش استودیوی بارکد" />
            </div>
            <div className="text-xs text-slate-400 mt-2 space-y-0.5">
              <p>📍 {a.location || 'محل نامشخص'}</p>
              <p>🔧 سریال: {a.serial || '—'}</p>
            </div>
            <div className="flex gap-2 mt-3">
              <button onClick={() => goRunner(a.id)} className="flex-1 text-xs bg-brand-50 text-brand-700 rounded-lg py-2 hover:bg-brand-100">اجرای بازرسی</button>
              {canManage && <button onClick={() => { setEditing(a); setShowForm(true); }} className="text-xs bg-slate-100 text-slate-600 rounded-lg py-2 px-3 hover:bg-slate-200">ویرایش</button>}
              {canManage && <button onClick={() => setConfirmDel(a)} className="text-xs bg-danger-50 text-danger-700 rounded-lg py-2 px-3 hover:bg-danger-100">حذف</button>}
            </div>
          </div>
        ))}
      </div>

      <Modal open={showForm} onClose={() => setShowForm(false)} title={editing ? 'ویرایش تجهیز' : 'تجهیز جدید'}>
        <AssetForm initial={editing} templates={data.templates.filter(t => !t.archived)} categories={data.categories}
          onSave={saveAsset} onCancel={() => setShowForm(false)} />
      </Modal>

      <ConfirmDialog open={!!confirmDel} title="حذف تجهیز"
        message={confirmDel ? `آیا از حذف «${confirmDel.code} - ${confirmDel.name}» مطمئن هستید؟ سوابق بازرسی مرتبط حذف نمی‌شوند اما به این تجهیز ارجاع خواهند داد.` : ''}
        danger onConfirm={() => deleteAsset(confirmDel.id)} onCancel={() => setConfirmDel(null)} />

      {studioAsset && <AssetQrStudio asset={studioAsset} org={data.settings} onClose={() => setStudioAsset(null)}
        onRun={() => { setStudioAsset(null); goRunner(studioAsset.id); }} />}

      <CameraScanner open={scannerOpen} onClose={() => setScannerOpen(false)} onDetect={onScanDetected} />
    </div>
  );
}

/* ============================================================
   ۱۲. صفحه مدیریت قالب‌های چک‌لیست (Templates)
   ============================================================ */
const ITEM_TYPE_LABELS = {
  checkbox: 'چک‌باکس (تأیید)',
  yesno: 'بله / خیر',
  rating: 'امتیازی',
  numeric: 'عددی',
  text: 'متنی',
  select: 'انتخابی',
};

function TemplateEditor({ initial, categories, onSave, onCancel }) {
  const [t, setT] = useState(initial || { name: '', category: categories[0] || '', passThreshold: 80, items: [] });

  const addItem = () => {
    setT({ ...t, items: [...t.items, { id: 'it-' + Date.now(), type: 'checkbox', label: '', weight: 10, critical: false }] });
  };
  const updateItem = (idx, patch) => {
    const items = t.items.slice();
    items[idx] = { ...items[idx], ...patch };
    setT({ ...t, items });
  };
  const removeItem = (idx) => {
    setT({ ...t, items: t.items.filter((_, i) => i !== idx) });
  };
  const move = (idx, dir) => {
    const items = t.items.slice();
    const j = idx + dir;
    if (j < 0 || j >= items.length) return;
    [items[idx], items[j]] = [items[j], items[idx]];
    setT({ ...t, items });
  };

  return (
    <div className="space-y-4">
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <Field label="نام قالب"><input className={inputCls} value={t.name} onChange={e => setT({ ...t, name: e.target.value })} /></Field>
        <Field label="دسته‌بندی">
          <select className={inputCls} value={t.category} onChange={e => setT({ ...t, category: e.target.value })}>
            {categories.map(c => <option key={c} value={c}>{c}</option>)}
          </select>
        </Field>
        <Field label="حد نصاب قبولی (%)">
          <input type="number" className={inputCls} value={t.passThreshold}
            onChange={e => setT({ ...t, passThreshold: Number(toEnglishDigits(e.target.value)) || 0 })} />
        </Field>
      </div>

      <div className="space-y-2">
        <div className="flex items-center justify-between">
          <h4 className="font-medium text-sm text-slate-700">آیتم‌های بازرسی</h4>
          <button onClick={addItem} className="text-xs bg-brand-50 text-brand-700 rounded-lg px-3 py-1.5 hover:bg-brand-100">+ افزودن آیتم</button>
        </div>
        {t.items.length === 0 && <p className="text-xs text-slate-400">هنوز آیتمی افزوده نشده است.</p>}
        {t.items.map((it, idx) => (
          <div key={it.id} className="border border-slate-200 rounded-xl p-3 space-y-2 bg-slate-50">
            <div className="flex gap-2">
              <input className={inputCls + " flex-1"} placeholder="عنوان آیتم" value={it.label} onChange={e => updateItem(idx, { label: e.target.value })} />
              <select className={inputCls + " w-40"} value={it.type} onChange={e => updateItem(idx, { type: e.target.value })}>
                {Object.entries(ITEM_TYPE_LABELS).map(([k, l]) => <option key={k} value={k}>{l}</option>)}
              </select>
            </div>
            <div className="flex flex-wrap items-center gap-3">
              <label className="text-xs text-slate-500 flex items-center gap-1">وزن
                <input type="number" className="w-16 border border-slate-300 rounded-lg px-2 py-1 text-xs" value={it.weight}
                  onChange={e => updateItem(idx, { weight: Number(toEnglishDigits(e.target.value)) || 0 })} />
              </label>
              {(it.type === 'checkbox' || it.type === 'yesno') && (
                <label className="text-xs text-slate-500 flex items-center gap-1.5">
                  <input type="checkbox" checked={!!it.critical} onChange={e => updateItem(idx, { critical: e.target.checked })} />
                  آیتم حیاتی (Critical)
                </label>
              )}
              {it.type === 'rating' && (
                <label className="text-xs text-slate-500 flex items-center gap-1">حداکثر امتیاز
                  <input type="number" className="w-14 border border-slate-300 rounded-lg px-2 py-1 text-xs" value={it.scaleMax || 5}
                    onChange={e => updateItem(idx, { scaleMax: Number(toEnglishDigits(e.target.value)) || 5 })} />
                </label>
              )}
              {it.type === 'select' && (
                <input className="flex-1 min-w-[10rem] border border-slate-300 rounded-lg px-2 py-1 text-xs" placeholder="گزینه‌ها با کاما جدا شوند"
                  value={(it.options || []).join('،')} onChange={e => updateItem(idx, { options: e.target.value.split(/[،,]/).map(s => s.trim()).filter(Boolean) })} />
              )}
              <div className="flex-1"></div>
              <button onClick={() => move(idx, -1)} className="w-7 h-7 rounded-lg hover:bg-slate-200 text-xs">▲</button>
              <button onClick={() => move(idx, 1)} className="w-7 h-7 rounded-lg hover:bg-slate-200 text-xs">▼</button>
              <button onClick={() => removeItem(idx)} className="w-7 h-7 rounded-lg hover:bg-danger-50 text-danger-600 text-xs">✕</button>
            </div>
          </div>
        ))}
      </div>

      <div className="flex gap-2 justify-end pt-2">
        <button onClick={onCancel} className="px-4 py-2 rounded-xl text-sm text-slate-600 hover:bg-slate-100">انصراف</button>
        <button onClick={() => t.name && onSave(t)} className="px-4 py-2 rounded-xl text-sm text-white bg-brand-600 hover:bg-brand-700">ذخیره قالب</button>
      </div>
    </div>
  );
}

function TemplatesPage() {
  const { data, update, notify } = useAppData();
  const [editing, setEditing] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [confirmArchive, setConfirmArchive] = useState(null);

  const usageCount = (tplId) => data.assets.filter(a => a.templateId === tplId).length;

  const saveTemplate = (t) => {
    update(d => {
      if (editing && editing.id) {
        const idx = d.templates.findIndex(x => x.id === editing.id);
        d.templates[idx] = { ...d.templates[idx], ...t };
      } else {
        d.templates.push({ id: 'tpl-' + Date.now(), archived: false, ...t });
      }
    });
    setShowForm(false); setEditing(null);
    notify('قالب چک‌لیست ذخیره شد.', 'success');
  };

  const toggleArchive = (tpl) => {
    update(d => {
      const idx = d.templates.findIndex(x => x.id === tpl.id);
      d.templates[idx].archived = !d.templates[idx].archived;
    });
    setConfirmArchive(null);
  };

  return (
    <div className="space-y-5">
      <div className="flex items-center justify-between">
        <div>
          <h2 className="text-lg font-bold text-slate-800">قالب‌های چک‌لیست</h2>
          <p className="text-sm text-slate-500">تعریف آیتم‌های بازرسی، وزن‌دهی و موارد حیاتی</p>
        </div>
        <button onClick={() => { setEditing(null); setShowForm(true); }} className="px-4 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium">+ قالب جدید</button>
      </div>

      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
        {data.templates.map(t => (
          <div key={t.id} className={"bg-white rounded-2xl border p-4 " + (t.archived ? "border-slate-200 opacity-60" : "border-slate-200")}>
            <div className="flex items-start justify-between">
              <div>
                <div className="font-bold text-slate-800">{t.name}</div>
                <div className="text-xs text-slate-400 mt-0.5">{t.category} · {toPersianDigits(t.items.length)} آیتم · حد نصاب {toPersianDigits(t.passThreshold)}٪</div>
              </div>
              {t.archived && <Badge tone="slate">بایگانی‌شده</Badge>}
            </div>
            <div className="flex gap-2 mt-3">
              <button onClick={() => { setEditing(t); setShowForm(true); }} className="text-xs bg-slate-100 text-slate-600 rounded-lg py-2 px-3 hover:bg-slate-200">ویرایش</button>
              <button onClick={() => setConfirmArchive(t)} className="text-xs bg-warn-50 text-warn-700 rounded-lg py-2 px-3 hover:bg-warn-500/20">
                {t.archived ? 'بازگردانی' : 'بایگانی'}
              </button>
            </div>
          </div>
        ))}
      </div>

      <Modal open={showForm} onClose={() => setShowForm(false)} wide title={editing ? 'ویرایش قالب' : 'قالب جدید'}>
        <TemplateEditor initial={editing} categories={data.categories} onSave={saveTemplate} onCancel={() => setShowForm(false)} />
      </Modal>

      <ConfirmDialog open={!!confirmArchive}
        title={confirmArchive && confirmArchive.archived ? 'بازگردانی قالب' : 'بایگانی قالب'}
        message={confirmArchive ? `این قالب توسط ${toPersianDigits(usageCount(confirmArchive.id))} تجهیز استفاده می‌شود. آیا ادامه می‌دهید؟` : ''}
        onConfirm={() => toggleArchive(confirmArchive)} onCancel={() => setConfirmArchive(null)} />
    </div>
  );
}

/* ============================================================
   ۱۳. موتور اجرای چک‌لیست (Runner)
   ============================================================ */
function ChecklistItemInput({ item, value, onChange }) {
  if (item.type === 'checkbox') {
    return (
      <label className="flex items-center gap-2.5 cursor-pointer">
        <input type="checkbox" className="w-5 h-5 accent-brand-600" checked={!!value} onChange={e => onChange(e.target.checked)} />
        <span className="text-sm text-slate-700">تأیید می‌شود</span>
      </label>
    );
  }
  if (item.type === 'yesno') {
    return (
      <div className="flex gap-2">
        {['بله', 'خیر'].map(v => (
          <button key={v} type="button" onClick={() => onChange(v)}
            className={"px-4 py-2 rounded-xl text-sm border " + (value === v ? (v === 'بله' ? "bg-ok-50 border-ok-500 text-ok-700" : "bg-danger-50 border-danger-500 text-danger-700") : "border-slate-200 text-slate-500 hover:bg-slate-50")}>
            {v}
          </button>
        ))}
      </div>
    );
  }
  if (item.type === 'rating') {
    const max = item.scaleMax || 5;
    return (
      <div className="flex gap-1.5">
        {Array.from({ length: max }, (_, i) => i + 1).map(n => (
          <button key={n} type="button" onClick={() => onChange(n)}
            className={"w-9 h-9 rounded-lg text-sm border " + (Number(value) >= n ? "bg-brand-600 border-brand-600 text-white" : "border-slate-200 text-slate-400 hover:bg-slate-50")}>
            {toPersianDigits(n)}
          </button>
        ))}
      </div>
    );
  }
  if (item.type === 'numeric') {
    return <input type="number" className={inputCls} value={value === undefined ? '' : value}
      onChange={e => onChange(toEnglishDigits(e.target.value))} />;
  }
  if (item.type === 'select') {
    return (
      <select className={inputCls} value={value || ''} onChange={e => onChange(e.target.value)}>
        <option value="">— انتخاب کنید —</option>
        {(item.options || []).map(o => <option key={o} value={o}>{o}</option>)}
      </select>
    );
  }
  return <textarea className={inputCls} rows={2} value={value || ''} onChange={e => onChange(e.target.value)} />;
}

function RunnerPage({ assetId, assignmentId, onFinish }) {
  const { data, update, currentUser, notify } = useAppData();
  const [selectedAssetId, setSelectedAssetId] = useState(assetId || (data.assets[0] && data.assets[0].id) || '');
  const asset = data.assets.find(a => a.id === selectedAssetId);
  const [templateId, setTemplateId] = useState(asset ? asset.templateId : '');
  const template = data.templates.find(t => t.id === templateId) || data.templates.find(t => t.id === (asset && asset.templateId));

  useEffect(() => {
    if (assetId) setSelectedAssetId(assetId);
  }, [assetId]);
  useEffect(() => {
    if (asset) setTemplateId(asset.templateId);
  }, [asset && asset.id]);

  const [answers, setAnswers] = useState({});
  const [dueDate, setDueDate] = useState('');
  const [notes, setNotes] = useState('');
  const [inspectorName, setInspectorName] = useState(currentUser.name || '');
  const [sigPad, setSigPad] = useState(null); // 'inspector' | 'approver' | null
  const [signatures, setSignatures] = useState({});
  const [submitting, setSubmitting] = useState(false);

  useEffect(() => { setAnswers({}); setSignatures({}); }, [templateId, selectedAssetId]);

  if (!asset || !template) {
    return <div className="bg-white rounded-2xl border border-slate-200 p-8 text-center text-slate-400">
      ابتدا یک تجهیز ثبت کنید تا بتوانید بازرسی را اجرا کنید.
    </div>;
  }

  const preview = scoreRecord(template, answers);

  const submit = () => {
    if (!inspectorName.trim()) { notify('نام بازرس را وارد کنید.', 'error'); return; }
    if (!signatures.inspector) { notify('امضای بازرس / اجراکننده الزامی است.', 'error'); return; }
    setSubmitting(true);
    const result = scoreRecord(template, answers);
    const record = {
      id: 'rec-' + Date.now(),
      assetId: asset.id,
      assetCode: asset.code,
      assetTitle: asset.name || '',
      location: asset.location || '',
      templateId: template.id,
      templateName: template.name,
      category: template.category || '',
      inspectorName: inspectorName.trim(),
      date: nowJalaliDateTime(),
      completedAt: new Date().toISOString(),
      dueDate,
      answers,
      details: result.details,
      percent: result.percent,
      status: result.status,
      criticalFail: !!result.criticalFail,
      score: Math.round(result.earned || 0),
      maxScore: result.totalWeight || 0,
      notes,
      signatures,
    };
    update(d => {
      d.records.unshift(record);
      if (assignmentId) {
        const idx = d.assignments.findIndex(a => a.id === assignmentId);
        if (idx > -1) { d.assignments[idx].status = 'done'; d.assignments[idx].recordId = record.id; d.assignments[idx].completedAt = new Date().toISOString(); }
      }
    });
    notify('بازرسی با موفقیت ثبت شد.', 'success');
    if (data.settings.googleAppsScriptUrl) {
      sendRecordToAppsScript(data.settings.googleAppsScriptUrl, record, data.settings, notify);
    }
    setSubmitting(false);
    if (onFinish) onFinish(record);
  };

  return (
    <div className="space-y-5">
      <div className="bg-white rounded-2xl border border-slate-200 p-4">
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <Field label="تجهیز">
            <select className={inputCls} value={selectedAssetId} onChange={e => setSelectedAssetId(e.target.value)}>
              {data.assets.map(a => <option key={a.id} value={a.id}>{a.code} — {a.name}</option>)}
            </select>
          </Field>
          <Field label="قالب چک‌لیست">
            <select className={inputCls} value={templateId} onChange={e => setTemplateId(e.target.value)}>
              {data.templates.filter(t => !t.archived).map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
            </select>
          </Field>
          <Field label="مهلت انجام (تاریخ شمسی)">
            <PersianDatePicker value={dueDate} onChange={setDueDate} />
          </Field>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-3">
          <Field label="نام بازرس / اجراکننده"><input className={inputCls} value={inspectorName} onChange={e => setInspectorName(e.target.value)} /></Field>
          <Field label="کد و محل تجهیز"><input disabled className={inputCls + " bg-slate-50 text-slate-400"} value={`${asset.code} · ${asset.location || '—'}`} /></Field>
        </div>
      </div>

      <div className="bg-white rounded-2xl border border-slate-200 p-4 space-y-4">
        <h3 className="font-bold text-slate-800">آیتم‌های بازرسی</h3>
        {template.items.map(item => (
          <div key={item.id} className="border-b border-slate-100 pb-4 last:border-0 last:pb-0">
            <div className="flex items-start justify-between mb-2">
              <p className="text-sm font-medium text-slate-700">{item.label}
                {item.critical && <span className="text-danger-500 mr-1.5 text-xs">(حیاتی)</span>}
              </p>
              {item.weight > 0 && <span className="text-xs text-slate-400 shrink-0">وزن {toPersianDigits(item.weight)}</span>}
            </div>
            <ChecklistItemInput item={item} value={answers[item.id]} onChange={v => setAnswers(a => ({ ...a, [item.id]: v }))} />
          </div>
        ))}
        <Field label="یادداشت‌های تکمیلی بازرسی"><textarea className={inputCls} rows={2} value={notes} onChange={e => setNotes(e.target.value)} /></Field>
      </div>

      <div className="bg-white rounded-2xl border border-slate-200 p-4 flex flex-wrap items-center gap-4">
        <div>
          <span className="text-xs text-slate-400">امتیاز لحظه‌ای:</span>
          <span className="text-lg font-bold text-slate-800 mx-1.5">{toPersianDigits(preview.percent)}٪</span>
          <StatusBadge status={preview.status} />
        </div>
      </div>

      <div className="bg-white rounded-2xl border border-slate-200 p-4 grid grid-cols-1 sm:grid-cols-2 gap-3">
        <button onClick={() => setSigPad('inspector')}
          className={"rounded-xl border-2 border-dashed p-4 text-sm text-center " + (signatures.inspector ? "border-ok-500 bg-ok-50" : "border-slate-300 hover:border-brand-400")}>
          {signatures.inspector ? (
            <div>
              <img src={signatures.inspector.image} className="h-14 mx-auto object-contain" />
              <p className="text-xs text-ok-700 mt-1">امضای بازرس ثبت شد — {signatures.inspector.name}</p>
            </div>
          ) : '✍️ ثبت امضای بازرس / اجراکننده'}
        </button>
        <button onClick={() => setSigPad('approver')}
          className={"rounded-xl border-2 border-dashed p-4 text-sm text-center " + (signatures.approver ? "border-ok-500 bg-ok-50" : "border-slate-300 hover:border-brand-400")}>
          {signatures.approver ? (
            <div>
              <img src={signatures.approver.image} className="h-14 mx-auto object-contain" />
              <p className="text-xs text-ok-700 mt-1">امضای ناظر ثبت شد — {signatures.approver.name}</p>
            </div>
          ) : '✍️ ثبت امضای ناظر / تحویل‌گیرنده (اختیاری)'}
        </button>
      </div>

      <div className="flex justify-end">
        <button onClick={submit} disabled={submitting}
          className="px-6 py-3 rounded-xl bg-brand-600 hover:bg-brand-700 disabled:opacity-60 text-white font-medium">
          ثبت نهایی بازرسی
        </button>
      </div>

      <SignaturePad open={!!sigPad} onClose={() => setSigPad(null)}
        roleLabel={sigPad === 'inspector' ? 'بازرس / اجراکننده' : 'ناظر / تحویل‌گیرنده در محل'}
        initialName={sigPad === 'inspector' ? inspectorName : ''}
        onSave={(sig) => setSignatures(s => ({ ...s, [sigPad]: sig }))} />
    </div>
  );
}

/* ============================================================
   ۱۴. موتور خروجی‌ها (چاپ تکی/پشت‌سرهم/تجمیعی، اکسل، CSV)

function recordReportHtml(rec, org) {
  const rows = rec.details.map(d => `
    <tr>
      <td>${d.label}</td>
      <td>${typeof d.value === 'boolean' ? (d.value ? 'تأیید شد' : 'تأیید نشد') : (d.value === undefined || d.value === null || d.value === '' ? '—' : toPersianDigits(String(d.value)))}</td>
      <td>${d.max > 0 ? toPersianDigits(Math.round(d.earned || 0)) + ' از ' + toPersianDigits(d.max) : 'اطلاعاتی'}</td>
      <td>${d.critical ? 'بله' : 'خیر'}</td>
    </tr>`).join('');
  return `
    <div class="report print-page">
      <div class="hdr">
        ${org.logoDataUrl ? `<img src="${org.logoDataUrl}" class="logo" />` : ''}
        <div class="hdr-text">
          <div class="org-name">${org.orgName || ''}</div>
          <div class="sub">گزارش رسمی بازرسی چک‌لیست</div>
        </div>
      </div>
      <table class="meta">
        <tr><td>تجهیز</td><td>${rec.assetCode}</td><td>قالب چک‌لیست</td><td>${rec.templateName}</td></tr>
        <tr><td>بازرس</td><td>${rec.inspectorName}</td><td>تاریخ ثبت</td><td>${toPersianDigits(rec.date)}</td></tr>
        <tr><td>مهلت انجام</td><td>${toPersianDigits(rec.dueDate || '—')}</td><td>نتیجه</td><td><b>${rec.status}</b></td></tr>
      </table>
      <table class="results">
        <thead><tr><th>عنوان آیتم</th><th>پاسخ</th><th>امتیاز</th><th>حیاتی</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="summary">
        <div>درصد موفقیت: <b>${toPersianDigits(rec.percent)}٪</b></div>
        <div>ارزیابی کیفی: <b>${qualityLabel(rec.percent)}</b></div>
      </div>
      ${rec.notes ? `<div class="notes"><b>یادداشت‌ها:</b> ${rec.notes}</div>` : ''}
      <div class="sigs">
        <div class="sig-box">
          <div class="sig-title">امضای بازرس / اجراکننده</div>
          ${rec.signatures && rec.signatures.inspector ? `<img src="${rec.signatures.inspector.image}" /><div class="sig-name">${rec.signatures.inspector.name} — ${rec.signatures.inspector.title || ''}</div>` : '<div class="sig-empty">ثبت نشده</div>'}
        </div>
        <div class="sig-box">
          <div class="sig-title">امضای ناظر / تحویل‌گیرنده</div>
          ${rec.signatures && rec.signatures.approver ? `<img src="${rec.signatures.approver.image}" /><div class="sig-name">${rec.signatures.approver.name} — ${rec.signatures.approver.title || ''}</div>` : '<div class="sig-empty">ثبت نشده</div>'}
        </div>
      </div>
    </div>`;
}

  .sub { font-size:12px; color:#475569; }

  table.meta td { border:1px solid #e2e8f0; padding:6px 8px; }
  table.meta td:nth-child(odd) { background:#f8fafc; font-weight:bold; width:15%; }

function openReportWindow(bodyHtml, title) {
  const w = window.open('', '_blank');
  if (!w) return;
  w.document.write(`<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>${title}</title><style>${REPORT_STYLE}</style></head><body>${bodyHtml}<script>window.onload=()=>{window.print();}<\/script></body></html>`);
  w.document.close();
}

function printSingleRecord(rec, org) {
  openReportWindow(recordReportHtml(rec, org), `گزارش ${rec.assetCode}`);
}

function printSequentialRecords(records, org) {
  openReportWindow(records.map(r => recordReportHtml(r, org)).join(''), 'گزارش پشت‌سرهم بازرسی‌ها');
}

function printSummaryReport(records, org) {
  const avg = records.length ? Math.round(records.reduce((s, r) => s + r.percent, 0) / records.length) : 0;
  const rows = records.map(r => `
    <tr>
      <td>${r.assetCode}</td><td>${r.templateName}</td><td>${r.inspectorName}</td>
      <td>${toPersianDigits(r.date)}</td><td>${toPersianDigits(r.percent)}٪</td><td>${r.status}</td>
    </tr>`).join('');
  const html = `
    <div class="report">
      <div class="hdr">
        ${org.logoDataUrl ? `<img src="${org.logoDataUrl}" class="logo" />` : ''}
        <div class="hdr-text"><div class="org-name">${org.orgName || ''}</div><div class="sub">گزارش تجمیعی سوابق بازرسی</div></div>
      </div>
      <table class="results">
        <thead><tr><th>تجهیز</th><th>قالب</th><th>بازرس</th><th>تاریخ</th><th>درصد</th><th>وضعیت</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="summary"><div>تعداد سوابق: <b>${toPersianDigits(records.length)}</b></div><div>میانگین موفقیت: <b>${toPersianDigits(avg)}٪</b></div></div>
    </div>`;
  openReportWindow(html, 'گزارش تجمیعی');
}

function exportRecordsXlsx(records, org) {
  const summarySheet = records.map(r => ({
    'کد تجهیز': r.assetCode, 'قالب چک‌لیست': r.templateName, 'بازرس': r.inspectorName,
    'تاریخ ثبت': r.date, 'مهلت انجام': r.dueDate || '', 'درصد موفقیت': r.percent, 'وضعیت': r.status,
  }));
  const detailRows = [];
  records.forEach(r => {
    (r.details || []).forEach(d => {
      detailRows.push({
        'کد تجهیز': r.assetCode, 'تاریخ ثبت': r.date, 'عنوان آیتم': d.label,
        'پاسخ': typeof d.value === 'boolean' ? (d.value ? 'تأیید شد' : 'تأیید نشد') : (d.value ?? ''),
        'امتیاز کسب‌شده': d.earned ?? '', 'حداکثر امتیاز': d.max, 'حیاتی': d.critical ? 'بله' : 'خیر',
      });
    });
    if (r.notes) detailRows.push({ 'کد تجهیز': r.assetCode, 'تاریخ ثبت': r.date, 'عنوان آیتم': 'یادداشت', 'پاسخ': r.notes, 'امتیاز کسب‌شده': '', 'حداکثر امتیاز': '', 'حیاتی': '' });
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summarySheet), 'خلاصه سوابق');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(detailRows), 'ریز پاسخها و یادداشتها');
  XLSX.writeFile(wb, `سوابق-بازرسی-${Date.now()}.xlsx`);
}

function exportRecordsCsv(records) {
  const header = ['کد تجهیز', 'قالب چک‌لیست', 'بازرس', 'تاریخ ثبت', 'مهلت انجام', 'درصد موفقیت', 'وضعیت'];
  const lines = [header.join(',')];
  records.forEach(r => {
    lines.push([r.assetCode, r.templateName, r.inspectorName, r.date, r.dueDate || '', r.percent, r.status]
      .map(v => `"${String(v).replace(/"/g, '""')}"`).join(','));
  });
  const csv = '\uFEFF' + lines.join('\r\n'); // BOM برای نمایش صحیح فارسی
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  downloadDataUrl(URL.createObjectURL(blob), `سوابق-بازرسی-${Date.now()}.csv`);
}

function UserForm({ initial, onSave, onCancel }) {
  const [username, setUsername] = useState(initial ? initial.username : '');
  const [name, setName] = useState(initial ? initial.name : '');
  const [role, setRole] = useState(initial ? initial.role : 'inspector');
  const [pages, setPages] = useState(initial && initial.pages ? initial.pages : (DEFAULT_PAGES_BY_ROLE[initial ? initial.role : 'inspector'] || []).filter(p => p !== 'users' && p !== 'settings'));
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');

  const togglePage = (key) => {
    setPages(p => p.includes(key) ? p.filter(x => x !== key) : [...p, key]);
  };

  const submit = async () => {
    if (!username.trim() || !name.trim()) { setError('نام کاربری و نام را کامل کنید.'); return; }
    let passwordHash = initial ? initial.passwordHash : null;
    if (password || !initial) {
      const errMsg = validatePasswordStrength(password);
      if (errMsg) { setError(errMsg); return; }
      passwordHash = await sha256Hex(password);
    }
    onSave({ username: username.trim(), name: name.trim(), role, pages, passwordHash, active: true });
  };

  return (
    <div className="space-y-3">
      <Field label="نام کاربری"><input className={inputCls} value={username} onChange={e => setUsername(e.target.value)} /></Field>
      <Field label="نام کامل"><input className={inputCls} value={name} onChange={e => setName(e.target.value)} /></Field>
      <Field label="نقش" hint={role === 'admin' ? 'کاربر ادمین همیشه به همه‌ی صفحات از جمله «کاربران» و «تنظیمات» دسترسی کامل دارد.' : 'می‌توانید در پایین دسترسی این کاربر را به‌صورت دقیق تنظیم کنید.'}>
        <select className={inputCls} value={role} onChange={e => setRole(e.target.value)}>
          <option value="admin">ادمین (دسترسی کامل)</option>
          <option value="manager">مدیر</option>
          <option value="inspector">بازرس</option>
          <option value="approver">تأییدکننده</option>
          <option value="viewer">مشاهده‌گر</option>
        </select>
      </Field>
      {role !== 'admin' && (
        <Field label="دسترسی به صفحات (اختصاصی برای این کاربر)" hint="صفحات «کاربران» و «تنظیمات» فقط مخصوص ادمین است و از این طریق قابل واگذاری نیست.">
          <div className="flex flex-wrap gap-2">
            {ASSIGNABLE_PAGES.map(p => (
              <label key={p.key} className={"flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs border cursor-pointer " + (pages.includes(p.key) ? "bg-brand-50 border-brand-300 text-brand-700" : "border-slate-200 text-slate-500")}>
                <input type="checkbox" className="hidden" checked={pages.includes(p.key)} onChange={() => togglePage(p.key)} />
                {p.label}
              </label>
            ))}
          </div>
        </Field>
      )}
      <Field label={initial ? 'رمز عبور جدید (اختیاری)' : 'رمز عبور'} hint="حداقل ۶ کاراکتر و شامل حداقل یک رقم">
        <input type="password" className={inputCls} value={password} onChange={e => setPassword(e.target.value)} />
      </Field>
      {error && <div className="text-danger-700 bg-danger-50 rounded-lg px-3 py-2 text-sm">{error}</div>}
      <div className="flex gap-2 justify-end pt-2">
        <button onClick={onCancel} className="px-4 py-2 rounded-xl text-sm text-slate-600 hover:bg-slate-100">انصراف</button>
        <button onClick={submit} className="px-4 py-2 rounded-xl text-sm text-white bg-brand-600 hover:bg-brand-700">ذخیره</button>
      </div>
    </div>
  );
}

function UsersPage() {
  const { data, update, notify, session } = useAppData();
  const [editing, setEditing] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [confirmDel, setConfirmDel] = useState(null);

  const dependents = (userId) => data.records.filter(r => r.inspectorName === (data.users.find(u => u.id === userId) || {}).name).length;

  const isSoleAdmin = (u) => u.role === 'admin' && data.users.filter(x => x.role === 'admin').length <= 1;

  const saveUser = async (u) => {
    if (editing) {
      const dup = data.users.some(x => x.username === u.username && x.id !== editing.id);
      if (dup) { notify('این نام کاربری قبلاً ثبت شده است.', 'error'); return; }
      if (isSoleAdmin(editing) && u.role !== 'admin') { notify('امکان تغییر نقش تنها ادمین سیستم وجود ندارد؛ ابتدا کاربر ادمین دیگری تعریف کنید.', 'error'); return; }
      update(d => { const idx = d.users.findIndex(x => x.id === editing.id); d.users[idx] = { ...d.users[idx], ...u }; });
    } else {
      const dup = data.users.some(x => x.username === u.username);
      if (dup) { notify('این نام کاربری قبلاً ثبت شده است.', 'error'); return; }
      update(d => { d.users.push({ id: 'u-' + Date.now(), ...u }); });
    }
    setShowForm(false); setEditing(null);
    notify('کاربر ذخیره شد.', 'success');
  };

  const toggleActive = (u) => {
    if (isSoleAdmin(u) && u.active !== false) { notify('امکان غیرفعال‌سازی تنها ادمین سیستم وجود ندارد.', 'error'); return; }
    update(d => { const idx = d.users.findIndex(x => x.id === u.id); d.users[idx].active = !d.users[idx].active; });
  };

  const deleteUser = (u) => {
    if (u.id === session.userId) { notify('امکان حذف حساب کاربری فعلی وجود ندارد.', 'error'); setConfirmDel(null); return; }
    if (isSoleAdmin(u)) { notify('امکان حذف تنها ادمین سیستم وجود ندارد.', 'error'); setConfirmDel(null); return; }
    update(d => { d.users = d.users.filter(x => x.id !== u.id); });
    setConfirmDel(null);
    notify('کاربر حذف شد.', 'success');
  };

  return (
    <div className="space-y-5">
      <div className="flex items-center justify-between">
        <div>
          <h2 className="text-lg font-bold text-slate-800">مدیریت کاربران</h2>
          <p className="text-sm text-slate-500">تعریف نقش‌ها و دسترسی‌ها</p>
        </div>
        <button onClick={() => { setEditing(null); setShowForm(true); }} className="px-4 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium">+ کاربر جدید</button>
      </div>

      <div className="bg-white rounded-2xl border border-slate-200 overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500 text-xs">
            <tr><th className="p-3 text-right">نام کاربری</th><th className="p-3 text-right">نام</th><th className="p-3 text-right">نقش</th><th className="p-3 text-right">وضعیت</th><th className="p-3 text-right">عملیات</th></tr>
          </thead>
          <tbody>
            {data.users.map(u => (
              <tr key={u.id} className="border-t border-slate-100">
                <td className="p-3" dir="ltr">{u.username}</td>
                <td className="p-3">{u.name}</td>
                <td className="p-3"><Badge tone="brand">{ROLE_LABELS[u.role]}</Badge></td>
                <td className="p-3">{u.active === false ? <Badge tone="slate">غیرفعال</Badge> : <Badge tone="ok">فعال</Badge>}</td>
                <td className="p-3 flex gap-1.5">
                  <button onClick={() => { setEditing(u); setShowForm(true); }} className="text-xs bg-slate-100 hover:bg-slate-200 rounded-lg px-2.5 py-1.5">ویرایش</button>
                  <button onClick={() => toggleActive(u)} className="text-xs bg-warn-50 text-warn-700 hover:bg-warn-500/20 rounded-lg px-2.5 py-1.5">{u.active === false ? 'فعال‌سازی' : 'غیرفعال‌سازی'}</button>
                  <button onClick={() => setConfirmDel(u)} className="text-xs bg-danger-50 text-danger-700 hover:bg-danger-100 rounded-lg px-2.5 py-1.5">حذف</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <Modal open={showForm} onClose={() => setShowForm(false)} title={editing ? 'ویرایش کاربر' : 'کاربر جدید'}>
        <UserForm initial={editing} onSave={saveUser} onCancel={() => setShowForm(false)} />
      </Modal>

      <ConfirmDialog open={!!confirmDel} title="حذف کاربر" danger
        message={confirmDel ? `«${confirmDel.name}» دارای ${toPersianDigits(dependents(confirmDel.id))} سابقه بازرسی ثبت‌شده است. حذف کاربر، سوابق را حذف نمی‌کند اما امکان ورود او را از بین می‌برد. ادامه می‌دهید؟` : ''}
        onConfirm={() => deleteUser(confirmDel)} onCancel={() => setConfirmDel(null)} />
    </div>
  );
}
