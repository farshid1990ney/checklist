  gy -= (gy <= 1600) ? 621 : 1600;
  var gy2 = (gm > 2) ? (gy + 1) : gy;
  var days = (365 * gy) + (Math.floor((gy2 + 3) / 4)) - (Math.floor((gy2 + 99) / 100)) +
    (Math.floor((gy2 + 399) / 400)) - 80 + gd + g_d_m[gm - 1];
  jy += 33 * (Math.floor(days / 12053));
  days %= 12053;
  jy += 4 * (Math.floor(days / 1461));
  days %= 1461;
  jy += Math.floor((days - 1) / 365);
  if (days > 365) days = (days - 1) % 365;
  var jm = (days < 186) ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
  var jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
  return { jy: jy, jm: jm, jd: jd };
}

function pad2(n) {
  n = String(n);
  return n.length === 1 ? "0" + n : n;
}

function toJalaliDate(dateObj) {
  var j = gregorianToJalali(dateObj.getFullYear(), dateObj.getMonth() + 1, dateObj.getDate());
  return j.jy + "/" + pad2(j.jm) + "/" + pad2(j.jd);
}

function toJalaliDateTime(dateObj) {
  return toJalaliDate(dateObj) + " - " + pad2(dateObj.getHours()) + ":" + pad2(dateObj.getMinutes());
}

function jalaliYear(dateObj) {
  return String(gregorianToJalali(dateObj.getFullYear(), dateObj.getMonth() + 1, dateObj.getDate()).jy);
}

function jalaliMonthFolder(dateObj) {
  var names = ["فروردین", "اردیبهشت", "خرداد", "تیر", "مرداد", "شهریور", "مهر", "آبان", "آذر", "دی", "بهمن", "اسفند"];
  var jm = gregorianToJalali(dateObj.getFullYear(), dateObj.getMonth() + 1, dateObj.getDate()).jm;
  return pad2(jm) + "-" + names[jm - 1];
}

// =====================================================================
// ورودی اصلی: doPost / doGet
// =====================================================================
function doPost(e) {
  var lock = LockService.getScriptLock();
  try {
    if (!e || !e.postData) return responseJson({ ok: false, error: "بدنه درخواست خالی است." });
    var data = JSON.parse(e.postData.contents);
    var action = data.action || "save_record";
    var rootFolderName = data.folderName || "سامانه چک‌لیست درکاو";

    // ۱. عملیات بدون نیاز به کلید (فقط تست ساده اتصال)
    if (action === "test" || action === "ping") {
      var rootFolderPing = getOrCreateFolder(DriveApp.getRootFolder(), rootFolderName);
      return responseJson({
        ok: true, status: "success",
        message: "اتصال به Google Drive با موفقیت برقرار شد!",
        version: "7.0", folderName: rootFolderName, folderUrl: rootFolderPing.getUrl()
      });
    }
    if (action === "version" || action === "health") {
      return responseJson({ ok: true, status: "success", version: "7.0", time: new Date().toISOString() });
    }

    // ۲. از این‌جا به بعد همه‌ی عملیات نیاز به کلید API معتبر دارند
    var auth = checkApiKey(data.apiKey);
    if (!auth.ok) return responseJson({ ok: false, status: "error", error: auth.error });

    // ۳. محدودسازی نرخ درخواست برای جلوگیری از سوءاستفاده
    var rl = checkRateLimit(data.apiKey || "shared");
    if (!rl.ok) return responseJson({ ok: false, status: "error", error: rl.error });

    // قفل هم‌زمانی: از تداخل چند کاربر هنگام نوشتن هم‌زمان روی شیت/پوشه جلوگیری می‌کند
    lock.tryLock(LOCK_WAIT_MS);

    var rootFolder = getOrCreateFolder(DriveApp.getRootFolder(), rootFolderName);
    var result = routeAction(action, data, rootFolder);
    logAction(rootFolder, action, data, result);
    return responseJson(result);

  } catch (err) {
    return responseJson({
      ok: false, status: "error",
      error: "خطا در سرور اسکریپت: " + err.toString(),
      message: "خطا در سرور اسکریپت: " + err.toString()
    });
  } finally {
    try { lock.releaseLock(); } catch (e2) {}
  }
}

function routeAction(action, data, rootFolder) {
  // ذخیره یک چک‌لیست کامل (PDF + ثبت در شیت تجمیعی)
  if (action === "save_record" || action === "record" || action === "save_pdf" || action === "save_html_pdf") {
    return handleSaveRecord(data, rootFolder);
  }
  // نسخه پشتیبان کامل سیستم (یک کاربر)
  if (action === "backup") {
    return handleBackup(data, rootFolder);
  }
  // پایگاه داده ابری چندکاربره
  if (action === "cloud_push") return handleCloudPush(data, rootFolder);
  if (action === "cloud_pull") return handleCloudPull(rootFolder);
  if (action === "cloud_meta") return handleCloudMeta(rootFolder);

  // فهرست سوابق ثبت‌شده (برای مرور/جست‌وجو از سمت برنامه)
  if (action === "list_records") return handleListRecords(rootFolder, data);
  // حذف یک سابقه (فایل به سطل زباله درایو منتقل می‌شود)
  if (action === "delete_record") return handleDeleteRecord(rootFolder, data);
  // تاییدیه یا رد یک سابقه توسط ناظر/تحویل‌گیرنده
  if (action === "approve_record") return handleApproveRecord(rootFolder, data);
  // خروجی فشرده (ZIP) از تمام PDFهای یک ماه/دسته مشخص
  if (action === "export_zip") return handleExportZip(rootFolder, data);

  return { ok: false, status: "error", error: "action نامعتبر است", message: "عملیات ناشناخته: " + action };
}

// =====================================================================
// امنیت: کلید API و محدودسازی نرخ
// =====================================================================
function checkApiKey(provided) {
  var props = PropertiesService.getScriptProperties();
  var saved = props.getProperty("API_KEY") || "";
  var given = String(provided || "").trim();
  if (!saved) {
    // هیچ کلیدی از قبل ثبت نشده: اولین کلید ارسالی به‌طور خودکار ثبت می‌شود.
    // برای امنیت بیشتر در استفاده‌ی واقعی، پیشنهاد می‌شود کلید را از قبل در
    // Script Properties با نام API_KEY تنظیم کنید تا این حالت رخ ندهد.
    if (given) { props.setProperty("API_KEY", given); return { ok: true }; }
    return { ok: false, error: "کلید API ارسال نشده و هیچ کلیدی از قبل ثبت نشده است." };
  }
  if (given === saved) return { ok: true };
  return { ok: false, error: "کلید API نامعتبر است." };
}

function checkRateLimit(key) {
  var cache = CacheService.getScriptCache();
  var cacheKey = "rl_" + key;
  var count = Number(cache.get(cacheKey) || "0");
  if (count >= RATE_LIMIT_PER_MINUTE) {
    return { ok: false, error: "تعداد درخواست‌ها بیش از حد مجاز است؛ کمی صبر کنید و دوباره تلاش کنید." };
  }
  cache.put(cacheKey, String(count + 1), 60); // شمارنده هر ۶۰ ثانیه ریست می‌شود
  return { ok: true };
}

// =====================================================================
// ذخیره‌سازی چک‌لیست (PDF + شیت تجمیعی)
// =====================================================================
function handleSaveRecord(data, rootFolder) {
  var rec = data.record;
  if (!rec) return { ok: false, status: "error", error: "فیلد record ارسال نشده است." };
  var d = new Date(rec.completedAt || rec.startedAt || new Date());
  var cat = rec.category || "عمومی";

  var yearFolder = getOrCreateFolder(rootFolder, jalaliYear(d));
  var monthFolder = getOrCreateFolder(yearFolder, jalaliMonthFolder(d));
  var catFolder = getOrCreateFolder(monthFolder, cat);

  var jDateStr = toJalaliDate(d).replace(/\//g, "-");
  var assetPart = rec.assetCode ? cleanName(rec.assetCode) + "_" : "";
  var titlePart = cleanName(rec.templateTitle || rec.templateName || "checklist");
  var idPart = (rec.id || "").slice(-6);
  var baseName = jDateStr + "_" + assetPart + titlePart + "_" + idPart;

  var mainFile;
  if (data.pdfBase64 && data.pdfBase64.length > 200) {
    // دقیق‌ترین حالت: فایل PDF از قبل در مرورگر کاربر ساخته و ارسال شده است
    mainFile = saveBase64Pdf(catFolder, baseName, data.pdfBase64);
  } else if (data.html && data.html.length > 0) {
    // حالت دوم: HTML کامل گزارش ارسال شده و در سرور به PDF تبدیل می‌شود
    mainFile = createPdfFromHtml(catFolder, baseName, data.html, rec);
  } else {
    // اگر هیچ‌کدام نبود، حداقل خود داده به‌صورت JSON ذخیره می‌شود تا چیزی از دست نرود
    mainFile = catFolder.createFile(baseName + ".json", JSON.stringify(rec, null, 2), MimeType.PLAIN_TEXT);
  }

  var sheetUrl = "";
  try { sheetUrl = recordToSpreadsheet(rootFolder, rec, mainFile.getUrl()); } catch (errSheet) {}

  // اعلان ایمیلی خودکار برای بازرسی‌های ناموفقِ حیاتی
  try {
    if (rec.criticalFail || rec.status === "ناموفق (حیاتی)") notifyCriticalFailure(rec, mainFile.getUrl());
  } catch (errMail) {}

  return {
    ok: true, status: "success", message: "چک‌لیست در Google Drive ذخیره شد", saved: 1,
    fileName: mainFile.getName(), fileUrl: mainFile.getUrl(), pdfUrl: mainFile.getUrl(),
    url: mainFile.getUrl(), sheetUrl: sheetUrl
  };
}

function notifyCriticalFailure(rec, fileUrl) {
  var adminEmail = PropertiesService.getScriptProperties().getProperty("ADMIN_EMAIL");
  if (!adminEmail) return;
  var subject = "⚠ بازرسی ناموفق حیاتی: " + (rec.assetCode || "") + " - " + (rec.templateTitle || rec.templateName || "");
  var body = "یک بازرسی با نتیجه «ناموفق حیاتی» ثبت شد.\n\n" +
    "تجهیز: " + (rec.assetCode || "—") + "\n" +
    "بازرس: " + (rec.inspector || rec.inspectorName || "—") + "\n" +
    "درصد: " + (rec.percent || 0) + "%\n" +
    "لینک فایل: " + fileUrl;
  MailApp.sendEmail(adminEmail, subject, body);
}

// =====================================================================
// نسخه پشتیبان کامل
// =====================================================================
function handleBackup(data, rootFolder) {
  var backupFolder = getOrCreateFolder(rootFolder, "پشتیبان کامل");
  var backupName = "پشتیبان_" + toJalaliDate(new Date()).replace(/\//g, "-") + "_" + new Date().getTime() + ".json";
  var backupPayload = data.payload || data.data || {};
  var backupFile = backupFolder.createFile(backupName, JSON.stringify(backupPayload, null, 2), MimeType.PLAIN_TEXT);
  purgeOldBackups(backupFolder, 20); // فقط ۲۰ نسخه پشتیبان آخر نگه داشته می‌شود
  return { ok: true, status: "success", message: "نسخه پشتیبان در Google Drive ذخیره شد", fileUrl: backupFile.getUrl() };
}

function purgeOldBackups(folder, keep) {
  var files = folder.getFiles();
  var list = [];
  while (files.hasNext()) list.push(files.next());
  list.sort(function (a, b) { return b.getDateCreated() - a.getDateCreated(); });
  for (var i = keep; i < list.length; i++) list[i].setTrashed(true);
}

// =====================================================================
// پایگاه داده ابری (هم‌گام‌سازی چندکاربره/چنددستگاهی)
// =====================================================================
function handleCloudPush(data, rootFolder) {
  var cloudFolder = getOrCreateFolder(rootFolder, "پایگاه ابری");
  var payload = { version: 1, updatedAt: new Date().toISOString(), meta: data.meta, data: data.data, deleted: data.deleted || {} };
  saveCloudFile(cloudFolder, payload);
  return { ok: true, status: "success", message: "اطلاعات در ابر ذخیره شد.", meta: data.meta, updatedAt: payload.updatedAt };
}

function handleCloudPull(rootFolder) {
  var cloudFolder = getOrCreateFolder(rootFolder, "پایگاه ابری");
  var stored = readCloudFile(cloudFolder);
  if (!stored) return { ok: true, status: "success", message: "در ابر اطلاعاتی وجود ندارد.", meta: null, data: null, deleted: null };
  return { ok: true, status: "success", message: "دریافت از ابر انجام شد.", meta: stored.meta, data: stored.data, deleted: stored.deleted, updatedAt: stored.updatedAt };
}

function handleCloudMeta(rootFolder) {
  var cloudFolder = getOrCreateFolder(rootFolder, "پایگاه ابری");
  var stored = readCloudFile(cloudFolder);
  if (!stored) return { ok: true, status: "success", exists: false, meta: null };
  var d = stored.data || {};
  return {
    ok: true, status: "success", exists: true, meta: stored.meta, updatedAt: stored.updatedAt,
    counts: {
      templates: (d.templates || []).length, records: (d.records || []).length,
      users: (d.users || []).length, assets: (d.assets || []).length, assignments: (d.assignments || []).length
    }
  };
}

function saveCloudFile(cloudFolder, payload) {
  var files = cloudFolder.getFilesByName("darkav-cloud-db.json");
  var content = JSON.stringify(payload);
  if (files.hasNext()) files.next().setContent(content);
  else cloudFolder.createFile("darkav-cloud-db.json", content, MimeType.PLAIN_TEXT);
}

function readCloudFile(cloudFolder) {
  var files = cloudFolder.getFilesByName("darkav-cloud-db.json");
  if (!files.hasNext()) return null;
  try { return JSON.parse(files.next().getBlob().getDataAsString()); } catch (e) { return null; }
}

// =====================================================================
// فهرست، حذف و تاییدیه‌ی سوابق (از روی شیت تجمیعی)
// =====================================================================
function getRecordsSheet(rootFolder) {
  var sheetName = "گزارش تجمیعی بازرسی‌ها (اکسل درکاو)";
  var files = rootFolder.getFilesByName(sheetName);
  if (!files.hasNext()) return null;
  return SpreadsheetApp.open(files.next()).getActiveSheet();
}

function handleListRecords(rootFolder, data) {
  var sheet = getRecordsSheet(rootFolder);
  if (!sheet) return { ok: true, status: "success", records: [] };
  var values = sheet.getDataRange().getValues();
  var headers = values.shift();
  var limit = Number(data.limit) || 200;
  var offset = Number(data.offset) || 0;
  var filterCat = data.category || null;
  var filterAsset = data.assetCode || null;

  var rows = values.map(function (row) {
    var obj = {};
    headers.forEach(function (h, i) { obj[h] = row[i]; });
    return obj;
  }).filter(function (r) {
    if (filterCat && r["دسته‌بندی"] !== filterCat) return false;
    if (filterAsset && r["کد تجهیز"] !== filterAsset) return false;
    return true;
  });

  rows.reverse(); // جدیدترین‌ها ابتدا
  var page = rows.slice(offset, offset + limit);
  return { ok: true, status: "success", total: rows.length, offset: offset, limit: limit, records: page };
}

function handleDeleteRecord(rootFolder, data) {
  var fileUrl = data.fileUrl;
  if (!fileUrl) return { ok: false, status: "error", error: "fileUrl ارسال نشده است." };
  var idMatch = fileUrl.match(/[-\w]{25,}/);
  if (!idMatch) return { ok: false, status: "error", error: "شناسه فایل از روی لینک قابل استخراج نیست." };
  try {
    var file = DriveApp.getFileById(idMatch[0]);
    file.setTrashed(true);
    return { ok: true, status: "success", message: "فایل به سطل زباله گوگل درایو منتقل شد." };
  } catch (e) {
    return { ok: false, status: "error", error: "فایل یافت نشد یا قابل حذف نیست: " + e.toString() };
  }
}

function handleApproveRecord(rootFolder, data) {
  var approvalFolder = getOrCreateFolder(rootFolder, "تاییدیه‌ها");
  var entry = {
    fileUrl: data.fileUrl || "", recordId: data.recordId || "",
    decision: data.decision === "reject" ? "رد شده" : "تایید شده",
    approverName: data.approverName || "—", note: data.note || "",
    approvedAt: toJalaliDateTime(new Date())
  };
  var name = "تاییدیه_" + toJalaliDate(new Date()).replace(/\//g, "-") + "_" + (data.recordId || "").slice(-6) + ".json";
  var file = approvalFolder.createFile(name, JSON.stringify(entry, null, 2), MimeType.PLAIN_TEXT);
  return { ok: true, status: "success", message: "تاییدیه ثبت شد.", fileUrl: file.getUrl(), entry: entry };
}

function handleExportZip(rootFolder, data) {
  var year = data.year, month = data.month; // مثل "1404" و "05-مرداد"
  if (!year || !month) return { ok: false, status: "error", error: "سال و ماه شمسی باید ارسال شود." };
  var yearFolders = rootFolder.getFoldersByName(year);
  if (!yearFolders.hasNext()) return { ok: false, status: "error", error: "پوشه‌ی این سال یافت نشد." };
  var yearFolder = yearFolders.next();
  var monthFolders = yearFolder.getFoldersByName(month);
  if (!monthFolders.hasNext()) return { ok: false, status: "error", error: "پوشه‌ی این ماه یافت نشد." };
  var monthFolder = monthFolders.next();

  var blobs = [];
  collectPdfBlobs(monthFolder, blobs);
  if (blobs.length === 0) return { ok: false, status: "error", error: "هیچ فایل PDF ای برای این بازه یافت نشد." };

  var zipBlob = Utilities.zip(blobs, year + "_" + month + ".zip");
  var exportFolder = getOrCreateFolder(rootFolder, "خروجی‌های فشرده");
  var zipFile = exportFolder.createFile(zipBlob);
  return { ok: true, status: "success", message: "فایل ZIP ساخته شد.", fileUrl: zipFile.getUrl(), count: blobs.length };
}

function collectPdfBlobs(folder, blobs) {
  var files = folder.getFiles();
  while (files.hasNext()) {
    var f = files.next();
    if (f.getMimeType() === MimeType.PDF) blobs.push(f.getBlob());
  }
  var subFolders = folder.getFolders();
  while (subFolders.hasNext()) collectPdfBlobs(subFolders.next(), blobs);
}

// =====================================================================
// ساخت فایل PDF (از Base64 آماده یا از HTML)
// =====================================================================
function saveBase64Pdf(folder, baseName, pdfBase64) {
  var bytes = Utilities.base64Decode(pdfBase64);
  var blob = Utilities.newBlob(bytes, "application/pdf", baseName + ".pdf");
  return folder.createFile(blob);
}

function createPdfFromHtml(folder, baseName, html, rec) {
  if (html && html.length > 20) {
    try {
      var htmlBlob = Utilities.newBlob(html, "text/html", baseName + ".html");
      var pdfFromHtml = htmlBlob.getAs("application/pdf");
      pdfFromHtml.setName(baseName + ".pdf");
      return folder.createFile(pdfFromHtml);
    } catch (htmlErr) {
      // در صورت شکست تبدیل مستقیم، به روش Google Docs زیر برمی‌گردیم
    }
  }

  var doc = null;
  try {
    doc = DocumentApp.create(baseName);
    var body = doc.getBody();
    var title = body.appendParagraph(rec.templateTitle || rec.templateName || "گزارش بازرسی");
    title.setHeading(DocumentApp.ParagraphHeading.HEADING1);
    title.setAlignment(DocumentApp.HorizontalAlignment.CENTER);
    if (rec.category) {
      var catP = body.appendParagraph(rec.category);
      catP.setAlignment(DocumentApp.HorizontalAlignment.CENTER);
    }
    body.appendHorizontalRule();
    var infoRows = [
      ["بازرس", String(rec.inspector || rec.inspectorName || "—"), "محل", String(rec.location || "—")],
      ["تجهیز", rec.assetCode ? (rec.assetCode + " - " + (rec.assetTitle || "")) : "—", "تاریخ", toJalaliDateTime(new Date(rec.completedAt || rec.startedAt || new Date()))],
      ["امتیاز", (rec.score || 0) + " از " + (rec.maxScore || 0), "درصد", (rec.percent || 0) + "%"],
    ];
    var infoTable = body.appendTable(infoRows);
    styleInfoTable(infoTable);
    var answers = rec.answers || rec.details || [];
    if (answers.length > 0) {
      var tableData = [["#", "آیتم", "پاسخ", "نتیجه", "یادداشت"]];
      for (var i = 0; i < answers.length; i++) {
        var a = answers[i];
        var valStr = a.value === true ? "بله" : a.value === false ? "خیر" : String(a.value == null ? "—" : a.value);
        tableData.push([String(i + 1), String(a.itemText || a.label || ""), valStr, a.passed ? "قبول" : "رد", String(a.note || "")]);
      }
      var itemsTable = body.appendTable(tableData);
      styleItemsTable(itemsTable);
    }
    if (rec.overallNote) body.appendParagraph("یادداشت کلی: " + rec.overallNote);
    body.appendHorizontalRule();
    var signTable = body.appendTable([["امضای بازرس / اجراکننده", "امضای ناظر / تحویل‌گیرنده"]]);
    var signRow = signTable.appendTableRow();
    insertSignatureCell(signRow.appendTableCell(), rec.executorSignature);
    insertSignatureCell(signRow.appendTableCell(), rec.approverSignature);
    doc.saveAndClose();
    var docDriveFile = DriveApp.getFileById(doc.getId());
    var pdfBlob = docDriveFile.getAs(MimeType.PDF);
    pdfBlob.setName(baseName + ".pdf");
    var pdfFile = folder.createFile(pdfBlob);
    docDriveFile.setTrashed(true);
    return pdfFile;
  } catch (err) {
    try { if (doc) DriveApp.getFileById(doc.getId()).setTrashed(true); } catch (e2) {}
    return folder.createFile(baseName + ".html", html || JSON.stringify(rec), MimeType.HTML);
  }
}

function insertSignatureCell(cell, sig) {
  try {
    cell.clear();
    if (sig && sig.imageData && sig.imageData.indexOf("base64,") !== -1) {
      var base64 = sig.imageData.split("base64,")[1];
      var bytes = Utilities.base64Decode(base64);
      var blob = Utilities.newBlob(bytes, "image/png", "sig.png");
      var img = cell.appendImage(blob);
      var w = 150;
      img.setWidth(w);
      img.setHeight(Math.round(w * (img.getHeight() / img.getWidth())) || 55);
      if (sig.signerName) cell.appendParagraph(sig.signerName).editAsText().setFontSize(9).setBold(true);
    } else {
      cell.appendParagraph(sig && sig.signerName ? sig.signerName : "— بدون امضا —").editAsText().setFontSize(9);
    }
  } catch (e) {
    cell.appendParagraph("—");
  }
}

function styleInfoTable(table) {
  try {
    table.setBorderColor("#cbd5e1");
    for (var r = 0; r < table.getNumRows(); r++) {
      var row = table.getRow(r);
      for (var c = 0; c < row.getNumCells(); c++) {
        var cell = row.getCell(c);
        cell.editAsText().setFontSize(9);
        if (c === 0 || c === 2) { cell.editAsText().setBold(true); cell.setBackgroundColor("#f1f5f9"); }
      }
    }

function recordToSpreadsheet(rootFolder, rec, fileUrl) {
  var sheetName = "گزارش تجمیعی بازرسی‌ها (اکسل درکاو)";
  var files = rootFolder.getFilesByName(sheetName);
  var ss;
  if (files.hasNext()) {
    ss = SpreadsheetApp.open(files.next());
  } else {
    ss = SpreadsheetApp.create(sheetName);
    var driveFile = DriveApp.getFileById(ss.getId());
    rootFolder.addFile(driveFile);
    DriveApp.getRootFolder().removeFile(driveFile);
    var firstSheet = ss.getActiveSheet();
    firstSheet.setName("سوابق بازرسی");
    firstSheet.appendRow([
      "تاریخ (شمسی)", "کد تجهیز", "عنوان چک‌لیست", "دسته‌بندی", "محل",
      "نام بازرس", "امتیاز کسب‌شده", "درصد موفقیت", "نتیجه بازرسی", "لینک فایل در گوگل درایو"
    ]);
  }

  var sheet = ss.getActiveSheet();
  var resultText = rec.criticalFail ? "ناموفق (حیاتی)" : (rec.percent >= 75 ? "عالی / قبول" : "نیاز به اصلاح");
  sheet.appendRow([
    toJalaliDateTime(new Date(rec.completedAt || rec.startedAt || new Date())),
    rec.assetCode || "—", rec.templateTitle || rec.templateName || "", rec.category || "", rec.location || "—",
    rec.inspector || rec.inspectorName || "—", (rec.score || 0) + " از " + (rec.maxScore || 0),
    (rec.percent || 0) + "%", resultText, fileUrl
  ]);
  return ss.getUrl();
}

// لاگ حسابرسی (کدام کاربر/کلید چه عملیاتی در چه زمانی انجام داد)

function logAction(rootFolder, action, data, result) {
  try {
    var logFolder = getOrCreateFolder(rootFolder, "لاگ سیستم");
    var name = "لاگ_" + jalaliYear(new Date()) + "_" + jalaliMonthFolder(new Date()) + ".csv";
    var files = logFolder.getFilesByName(name);
    var line = [
      new Date().toISOString(), action,
      (data.record && (data.record.inspector || data.record.inspectorName)) || "",
      result && result.ok ? "OK" : "ERROR"
    ].join(",") + "\n";
    if (files.hasNext()) {
      var f = files.next();
      f.setContent(f.getBlob().getDataAsString() + line);
    } else {
      logFolder.createFile(name, "زمان,عملیات,کاربر,نتیجه\n" + line, MimeType.PLAIN_TEXT);
    }
  } catch (e) {
    // لاگ هرگز نباید باعث شکست عملیات اصلی شود
  }
}

// فراخوانی عمومی وب‌سرویس Google Apps Script؛ برای همه‌ی عملیات (ذخیره، پشتیبان‌گیری،
// هم‌گام‌سازی ابری و ...) از این تابع استفاده می‌شود. content-type به‌عمد text/plain
// نگه داشته شده تا مرورگر درخواست OPTIONS (preflight) که Apps Script پشتیبانی نمی‌کند
// ارسال نکند.
async function callAppsScript(url, org, payload) {
  if (!url) throw new Error('آدرس اسکریپت گوگل در تنظیمات وارد نشده است.');
  const body = Object.assign({ apiKey: org.cloudApiKey || '' }, payload);
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
  });
  let json;
  try { json = await res.json(); }
  catch (e) { throw new Error('پاسخ سرور قابل خواندن نبود (ممکن است آدرس اسکریپت نادرست باشد).'); }
  if (!json || json.ok === false) throw new Error((json && (json.error || json.message)) || 'خطای نامشخص از سرور.');
  return json;
}

async function sendRecordToAppsScript(url, record, org, notify) {
  try {
    const html = `<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><style>${REPORT_STYLE}</style></head><body>${recordReportHtml(record, org)}</body></html>`;
    const json = await callAppsScript(url, org, {
      action: 'save_pdf',
      folderName: (org.orgName ? org.orgName + ' - ' : '') + 'سامانه چک‌لیست درکاو',
      record: {
        id: record.id, assetCode: record.assetCode, assetTitle: record.assetTitle,
        templateTitle: record.templateName, category: record.category || 'عمومی',
        inspector: record.inspectorName, location: record.location || '',
        completedAt: record.completedAt || new Date().toISOString(),
        percent: record.percent, status: record.status, criticalFail: !!record.criticalFail,
        score: record.score || 0, maxScore: record.maxScore || 0,
      },
      html,
    });
    notify('فایل PDF بازرسی در Google Drive ذخیره شد.', 'success');
    return json;
  } catch (e) {
    notify('ذخیره در Google Drive ناموفق بود: ' + e.message, 'error');
  }
}

// ارسال نسخه پشتیبان کامل به Google Drive (علاوه بر دانلود محلی)
async function pushCloudBackup(url, org, fullData, notify) {
  try {
    await callAppsScript(url, org, { action: 'backup', payload: fullData });
    notify('نسخه پشتیبان در Google Drive ذخیره شد.', 'success');
  } catch (e) { notify('پشتیبان‌گیری ابری ناموفق بود: ' + e.message, 'error'); }
}

// ارسال کامل داده‌های برنامه به پایگاه ابری (برای هم‌گام‌سازی چندکاربره/چنددستگاهی)
async function cloudPush(url, org, fullData, notify) {
  try {
    await callAppsScript(url, org, { action: 'cloud_push', meta: { device: navigator.userAgent, at: new Date().toISOString() }, data: fullData });
    notify('اطلاعات با موفقیت در پایگاه ابری ذخیره شد.', 'success');
  } catch (e) { notify('ارسال به پایگاه ابری ناموفق بود: ' + e.message, 'error'); }
}

// دریافت کامل داده‌ها از پایگاه ابری (برای بازیابی روی دستگاه/کاربر دیگر)
async function cloudPull(url, org, notify) {
  try {
    const json = await callAppsScript(url, org, { action: 'cloud_pull' });
    if (!json.data) { notify('در پایگاه ابری هنوز اطلاعاتی ذخیره نشده است.', 'info'); return null; }
    notify('اطلاعات از پایگاه ابری دریافت شد.', 'success');
    return json.data;
  } catch (e) { notify('دریافت از پایگاه ابری ناموفق بود: ' + e.message, 'error'); return null; }
}

async function testAppsScriptConnection(url, org, notify) {
  try {
    const json = await callAppsScript(url, org, { action: 'ping', folderName: (org.orgName ? org.orgName + ' - ' : '') + 'سامانه چک‌لیست درکاو' });
    notify('اتصال برقرار است — نسخه سرور: ' + (json.version || '؟'), 'success');
  } catch (e) { notify('اتصال ناموفق بود: ' + e.message, 'error'); }
}

function ChangePasswordModal({ open, onClose }) {
  const { data, update, session, notify } = useAppData();
  const [current, setCurrent] = useState('');
  const [next, setNext] = useState('');
  const [confirm, setConfirm] = useState('');
  const [error, setError] = useState('');

  const submit = async () => {
    const user = data.users.find(u => u.id === session.userId);
    const curHash = await sha256Hex(current);
    if (curHash !== user.passwordHash) { setError('رمز فعلی نادرست است.'); return; }
    const errMsg = validatePasswordStrength(next);
    if (errMsg) { setError(errMsg); return; }
    if (next !== confirm) { setError('تکرار رمز جدید مطابقت ندارد.'); return; }
    const newHash = await sha256Hex(next);
    update(d => { const idx = d.users.findIndex(u => u.id === session.userId); d.users[idx].passwordHash = newHash; });
    notify('رمز عبور با موفقیت تغییر کرد.', 'success');
    setCurrent(''); setNext(''); setConfirm(''); setError('');
    onClose();
  };

  return (
    <Modal open={open} onClose={onClose} title="تغییر رمز عبور">
      <div className="space-y-3">
        <Field label="رمز فعلی"><input type="password" className={inputCls} value={current} onChange={e => setCurrent(e.target.value)} /></Field>
        <Field label="رمز جدید" hint="حداقل ۶ کاراکتر و شامل حداقل یک رقم"><input type="password" className={inputCls} value={next} onChange={e => setNext(e.target.value)} /></Field>
        <Field label="تکرار رمز جدید"><input type="password" className={inputCls} value={confirm} onChange={e => setConfirm(e.target.value)} /></Field>
        {error && <div className="text-danger-700 bg-danger-50 rounded-lg px-3 py-2 text-sm">{error}</div>}
        <button onClick={submit} className="w-full bg-brand-600 hover:bg-brand-700 text-white rounded-xl py-2.5 text-sm">ذخیره رمز جدید</button>
      </div>
    </Modal>
  );
}

/* ============================================================

   ============================================================ */
function isAssignmentOverdue(a) {
  if (!a || a.status !== 'pending' || !a.dueDate) return false;
  try {
    const parts = toEnglishDigits(a.dueDate).split('/').map(Number);
    if (parts.length !== 3 || parts.some(isNaN)) return false;
    const [gy, gm, gd] = toGregorian(parts[0], parts[1], parts[2]);
    const due = new Date(gy, gm - 1, gd, 23, 59, 59);
    return due.getTime() < Date.now();
  } catch (e) { return false; }
}

function AssignmentForm({ users, assets, templates, onSave, onCancel }) {
  const [assignedToUserId, setAssignedToUserId] = useState(users[0] ? users[0].id : '');
  const [assetId, setAssetId] = useState(assets[0] ? assets[0].id : '');

  const [templateId, setTemplateId] = useState(asset ? asset.templateId : (templates[0] ? templates[0].id : ''));
  const [dueDate, setDueDate] = useState('');
  const [note, setNote] = useState('');
  const [error, setError] = useState('');

  useEffect(() => { if (asset) setTemplateId(asset.templateId); }, [assetId]);

  const submit = () => {
    if (!assignedToUserId || !assetId || !templateId) { setError('همه‌ی فیلدهای الزامی را تکمیل کنید.'); return; }
    onSave({ assignedToUserId, assetId, templateId, dueDate, note: note.trim() });
  };

  return (
    <div className="space-y-3">
      <Field label="محول به کاربر">
        <select className={inputCls} value={assignedToUserId} onChange={e => setAssignedToUserId(e.target.value)}>

      </Field>

        <select className={inputCls} value={assetId} onChange={e => setAssetId(e.target.value)}>
          {assets.map(a => <option key={a.id} value={a.id}>{a.code} — {a.name}</option>)}
        </select>
      </Field>
      <Field label="قالب چک‌لیست">
        <select className={inputCls} value={templateId} onChange={e => setTemplateId(e.target.value)}>
          {templates.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
        </select>
      </Field>
      <Field label="مهلت انجام (اختیاری)">
        <PersianDatePicker value={dueDate} onChange={setDueDate} placeholder="انتخاب تاریخ" />
      </Field>
      <Field label="یادداشت برای انجام‌دهنده (اختیاری)">

        <button onClick={submit} className="px-4 py-2 rounded-xl text-sm text-white bg-brand-600 hover:bg-brand-700">واگذاری وظیفه</button>
      </div>
    </div>
  );
}

function TasksPage({ goRunner }) {
  const { data, update, currentUser, notify } = useAppData();
  const canManage = currentUser.role === 'admin' || currentUser.role === 'manager';
  const [showForm, setShowForm] = useState(false);
  const [confirmDel, setConfirmDel] = useState(null);

  const userName = (id) => (data.users.find(u => u.id === id) || {}).name || '—';
  const assetLabel = (id) => { const a = data.assets.find(x => x.id === id); return a ? `${a.code} — ${a.name}` : '—'; };
  const templateName = (id) => (data.templates.find(t => t.id === id) || {}).name || '—';

  const assignTask = (payload) => {
    update(d => {
      d.assignments.unshift({
        id: 'asg-' + Date.now(), ...payload, status: 'pending',
        createdBy: currentUser.id, createdAt: new Date().toISOString(), recordId: null,
      });
    });
    setShowForm(false);
    notify('وظیفه با موفقیت واگذار شد.', 'success');
  };

  const deleteTask = (a) => {
    update(d => { d.assignments = d.assignments.filter(x => x.id !== a.id); });
    setConfirmDel(null);
    notify('وظیفه حذف شد.', 'success');
  };

  const toggleDone = (a) => {
    update(d => {
      const idx = d.assignments.findIndex(x => x.id === a.id);
      if (idx > -1) d.assignments[idx].status = d.assignments[idx].status === 'done' ? 'pending' : 'done';
    });

  const statusBadge = (a) => {
    if (a.status === 'done') return <Badge tone="ok">انجام شد</Badge>;
    if (isAssignmentOverdue(a)) return <Badge tone="danger">دیرکرد</Badge>;
    return <Badge tone="warn">در انتظار انجام</Badge>;

        </div>
        {canManage && (
          <button onClick={() => setShowForm(true)} className="px-4 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium">+ واگذاری وظیفه جدید</button>
        )}
      </div>

      <div className="bg-white rounded-2xl border border-slate-200">
        <div className="p-4 border-b border-slate-100 font-bold text-slate-800 text-sm">وظایف من</div>
        <div className="divide-y divide-slate-100">
          {myTasks.map(a => (
            <div key={a.id} className="p-4 flex items-center justify-between gap-3 text-sm">
              <div className="min-w-0">
                <p className="font-medium text-slate-800 truncate">{assetLabel(a.assetId)} — {templateName(a.templateId)}</p>
                <p className="text-xs text-slate-400 mt-0.5">
                  {a.dueDate ? `مهلت: ${toPersianDigits(a.dueDate)}` : 'بدون مهلت مشخص'}
                  {a.note ? ` · ${a.note}` : ''}
                </p>
              </div>
              <div className="flex items-center gap-2 shrink-0">
                {statusBadge(a)}
                {a.status !== 'done' && (
                  <button onClick={() => goRunner(a.assetId, a.id)} className="text-xs bg-brand-600 hover:bg-brand-700 text-white rounded-lg px-2.5 py-1.5">اجرای چک‌لیست</button>
                )}
              </div>
            </div>
          ))}
          {myTasks.length === 0 && <p className="p-6 text-center text-slate-400 text-sm">در حال حاضر وظیفه‌ای برای شما ثبت نشده است.</p>}
        </div>
      </div>

      {canManage && (
        <div className="bg-white rounded-2xl border border-slate-200 overflow-x-auto">
          <div className="p-4 border-b border-slate-100 font-bold text-slate-800 text-sm">همه‌ی وظایف (مدیریت)</div>
          <table className="w-full text-sm">
            <thead className="bg-slate-50 text-slate-500 text-xs">
              <tr><th className="p-3 text-right">تجهیز</th><th className="p-3 text-right">قالب</th><th className="p-3 text-right">محول به</th><th className="p-3 text-right">مهلت</th><th className="p-3 text-right">وضعیت</th><th className="p-3 text-right">عملیات</th></tr>
            </thead>
            <tbody>
              {allTasks.map(a => (
                <tr key={a.id} className="border-t border-slate-100">
                  <td className="p-3">{assetLabel(a.assetId)}</td>
                  <td className="p-3">{templateName(a.templateId)}</td>

            <div>
              <p className="text-white font-bold text-sm leading-tight">چک‌لیست درکاو</p>
              <p className="text-xs text-slate-500">{data.settings.orgName}</p>
            </div>
          </div>
        </div>
        <nav className="p-3 space-y-1">
          {visibleNav.map(n => (
            <button key={n.key} onClick={() => goPage(n.key)}
              className={"w-full text-right flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-sm transition " +
                (page === n.key ? "bg-brand-600 text-white" : "hover:bg-white/5 text-slate-300")}>
              <span>{n.icon}</span>{n.label}
            </button>
          ))}
        </nav>
        <div className="absolute bottom-0 inset-x-0 p-3 border-t border-white/10">
          <button onClick={logout} className="w-full text-right px-3.5 py-2.5 rounded-xl text-sm text-slate-300 hover:bg-white/5 flex items-center gap-2.5">
            <span>🚪</span>خروج از حساب
          </button>
        </div>
      </aside>

      <div className="flex-1 min-w-0">
        <header className="no-print sticky top-0 z-20 bg-white/80 backdrop-blur border-b border-slate-200 flex items-center justify-between px-4 sm:px-6 py-3">
          <button onClick={() => setSidebarOpen(true)} className="sm:hidden w-9 h-9 rounded-lg hover:bg-slate-100">☰</button>
          <h1 className="font-bold text-slate-800 hidden sm:block">{visibleNav.find(n => n.key === page)?.label}</h1>
          <div className="relative">
            <button onClick={() => setShowUserMenu(s => !s)} className="flex items-center gap-2 px-3 py-1.5 rounded-xl hover:bg-slate-100">
              <span className="w-7 h-7 rounded-full bg-brand-100 text-brand-700 flex items-center justify-center text-xs font-bold">{currentUser.name?.[0] || '?'}</span>
              <span className="text-sm text-slate-700 hidden sm:inline">{currentUser.name}</span>
              <Badge tone="brand">{ROLE_LABELS[currentUser.role]}</Badge>
            </button>
            {showUserMenu && (
              <div className="absolute left-0 mt-2 bg-white border border-slate-200 rounded-xl shadow-lg w-48 py-1.5 z-30">
                <button onClick={() => { setShowPwModal(true); setShowUserMenu(false); }} className="w-full text-right px-4 py-2 text-sm hover:bg-slate-50">تغییر رمز عبور</button>
                <button onClick={logout} className="w-full text-right px-4 py-2 text-sm hover:bg-slate-50 text-danger-600">خروج</button>
              </div>
            )}
          </div>
        </header>
        <main className="p-4 sm:p-6">{content}</main>
      </div>

      <ChangePasswordModal open={showPwModal} onClose={() => setShowPwModal(false)} />
    </div>
  );
}

/* ============================================================
   ۲۳. ریشه برنامه و راه‌اندازی
   ============================================================ */
function Root() {
  const { session } = useAppData();
  return session ? <AppShell /> : <LoginScreen />;
}

function App() {
  return (
    <DataProvider>
      <Root />
    </DataProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

<!--
  توضیح فنی: بلوک بالا با type="text/plain" علامت‌گذاری شده تا مرورگر آن را مستقیم اجرا نکند.
  اسکریپت زیر آن را با Babel و «runtime کلاسیک» (React.createElement) کامپایل می‌کند؛
  این کار به‌عمد به‌جای ترنسفورم خودکار Babel Standalone انجام می‌شود، چون حالت
  پیش‌فرض جدید Babel («automatic» JSX runtime) به ماژول react/jsx-runtime نیاز دارد
  که در بارگذاری ساده React از طریق تگ <script> (UMD/global) در دسترس نیست.
-->
<script>
  (function () {
    const source = document.getElementById('app-source').textContent;
    const output = Babel.transform(source, {
      presets: [
        ['react', { runtime: 'classic' }],
        ['env', { modules: false }],
      ],
      filename: 'app.jsx',
    }).code;
    const scriptEl = document.createElement('script');
    scriptEl.textContent = output;
    document.body.appendChild(scriptEl);
  })();
</script>
